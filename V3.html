<body>
<header class="topbar">
  <div class="brand" onclick="app.go('home')">
    <div class="logo">AE</div><div><div class="brand-name">Accounting Explorer</div><div class="brand-sub">Don’t just read about accounting. Try the work.</div></div>
  </div>
  <nav>
    <button onclick="app.go('home')">Home</button><button onclick="app.go('hub')">Challenges</button><button onclick="app.go('careers')">Careers</button><button onclick="app.go('myths')">Perceptions</button><button onclick="app.go('ai')">AI</button><button onclick="app.go('industries')">Industries</button><button onclick="app.go('teachers')">For Educators</button>
  </nav>
  <div class="progress-mini"><span id="miniProgressLabel">0 of 5 experiences completed</span><div class="track"><div id="miniProgressBar" class="fill"></div></div></div>
</header>
<main id="app" class="shell"></main>
<footer><div>Accounting Explorer · Career exploration prototype</div><div class="footer-actions"><button class="link-btn" onclick="app.go('teachers')">For Educators</button><button class="link-btn danger" onclick="app.reset()">Restart Experience</button></div><small>Built for career exploration, not accounting instruction or aptitude testing.</small></footer>
<script>
const app = (() => {
  const defaultState = {
    userType:null, preSurvey:{}, postSurvey:{}, completed:{bookkeeping:false,tax:false,audit:false,forensic:false,ai:false},
    behaviors:{bookkeeping:[],tax:[],audit:[],forensic:[],ai:[]}, badges:[], reflections:{}, favoriteAreas:[], selectedIndustry:null,
    selectedMyth:null, selectedCareer:null, simStep:{}, aiStep:0, teacherSlide:0, teacherPresenting:false, classVotes:{}, classReveals:{}, teacherCases:{}
  };
  let state=loadState();
  const experiences=['bookkeeping','tax','audit','forensic','ai'];
  const simMeta={
    forensic:{verb:'Investigate',title:'The Missing Money',question:'$14,000 is missing. What happened?',duration:'8–10 min',career:'Forensic Accounting',skill:'Investigation + pattern recognition'},
    audit:{verb:'Verify',title:'The Warehouse Mismatch',question:'The records do not match what is actually in the warehouse. What would you investigate?',duration:'7–9 min',career:'Audit',skill:'Evidence + professional skepticism'},
    tax:{verb:'Advise',title:'The Expansion Decision',question:'A growing company can open its next location in one of two states. What should it consider?',duration:'6–8 min',career:'Tax / Advisory',skill:'Planning + judgment'},
    bookkeeping:{verb:'Organize',title:'The Messy Week',question:'A small company had a busy week. Can you organize what happened?',duration:'4–6 min',career:'Bookkeeping / Corporate Accounting',skill:'Organization + accuracy'}
  };
  const industries={
    'Sports':{bookkeeping:'Track team, venue, ticketing, and event activity.',tax:'Help athletes or franchises evaluate tax and business decisions.',audit:'Verify financial information for teams, leagues, and venues.',forensic:'Investigate misuse of funds or suspicious payments.',ai:'Analyze ticketing, payroll, and transaction data for unusual patterns.'},
    'Music':{bookkeeping:'Track artist, venue, royalty, and label activity.',tax:'Advise artists and entertainment companies on tax decisions.',audit:'Verify financial information for music and media companies.',forensic:'Investigate royalty discrepancies or missing funds.',ai:'Analyze royalty and payment data for unusual trends.'},
    'Gaming':{bookkeeping:'Track digital sales, subscriptions, and development costs.',tax:'Evaluate tax issues for studios operating across locations.',audit:'Test revenue, deferred revenue, and transaction data.',forensic:'Investigate payment abuse or vendor fraud.',ai:'Analyze large transaction datasets and flag anomalies.'},
    'Fashion':{bookkeeping:'Track inventory, sales, returns, and operating expenses.',tax:'Support expansion, sourcing, and tax planning decisions.',audit:'Test inventory and sales records.',forensic:'Investigate vendor or procurement fraud.',ai:'Identify unusual purchasing or sales patterns.'},
    'Technology':{bookkeeping:'Track subscriptions, software sales, and operating costs.',tax:'Research credits, incentives, and cross-border issues.',audit:'Evaluate revenue, expenses, and financial controls.',forensic:'Investigate insider misconduct or suspicious payments.',ai:'Automate data processing and support complex analysis.'},
    'Movies & Entertainment':{bookkeeping:'Track production budgets, distribution revenue, and expenses.',tax:'Advise productions on incentives and location decisions.',audit:'Verify production and studio financial information.',forensic:'Investigate misuse of production funds or royalty disputes.',ai:'Analyze production and payment data for inconsistencies.'},
    'Healthcare':{bookkeeping:'Track patient revenue, payroll, supplies, and operating costs.',tax:'Support nonprofit, business, and employee tax decisions.',audit:'Verify healthcare organization financial statements.',forensic:'Investigate billing fraud or misuse of funds.',ai:'Analyze claims and payment data for unusual patterns.'},
    'Food & Restaurants':{bookkeeping:'Track sales, inventory, payroll, and supplier payments.',tax:'Help evaluate expansion and incentives.',audit:'Verify sales, inventory, and expense records.',forensic:'Investigate cash skimming or vendor schemes.',ai:'Classify transactions and flag abnormal spending.'},
    'Government':{bookkeeping:'Track public funds and expenditures.',tax:'Support tax administration and policy implementation.',audit:'Evaluate whether public funds are reported and used appropriately.',forensic:'Investigate fraud, waste, or misuse of public funds.',ai:'Analyze large public datasets and flag anomalies.'}
  };
  const careers=[
    {name:'Audit',tag:'Verify',problem:'Can we trust the financial information?',work:'Examine evidence, ask questions, test transactions, and evaluate explanations.',skills:['Skepticism','Communication','Evidence','Teamwork'],where:'Public accounting firms, corporations, government, nonprofits'},
    {name:'Tax',tag:'Advise',problem:'What are the financial and tax consequences of this decision?',work:'Research rules, understand facts, compare alternatives, and explain risks.',skills:['Research','Judgment','Writing','Client service'],where:'Public accounting, corporations, law-related environments, government'},
    {name:'Forensic Accounting',tag:'Investigate',problem:'What happened here?',work:'Follow financial evidence, identify patterns, investigate fraud or disputes, and communicate findings.',skills:['Curiosity','Pattern recognition','Interviewing','Analysis'],where:'Consulting firms, law-enforcement-related work, corporations, government'},
    {name:'Corporate Accounting',tag:'Organize',problem:'What happened financially, and how should it be reported?',work:'Maintain reliable records, close the books, prepare reports, and support decisions.',skills:['Accuracy','Systems','Organization','Business understanding'],where:'Companies in nearly every industry'},
    {name:'M&A / Transactions',tag:'Evaluate',problem:'What is this company worth and what risks matter in a deal?',work:'Analyze financial information, investigate deal risks, and support acquisitions or investments.',skills:['Analysis','Valuation mindset','Communication','Commercial thinking'],where:'Advisory firms, investment environments, corporations'},
    {name:'Advisory',tag:'Solve',problem:'How should this organization improve or respond?',work:'Use accounting knowledge to help clients solve business, process, risk, and transaction problems.',skills:['Problem solving','Presentation','Business judgment','Collaboration'],where:'Professional services firms and internal corporate teams'},
    {name:'Consulting',tag:'Change',problem:'How can the organization operate better?',work:'Work across strategy, operations, technology, finance, and transformation projects.',skills:['Structured thinking','Communication','Project work','Technology'],where:'Consulting firms and large organizations'},
    {name:'Accounting Technology & Analytics',tag:'Adapt',problem:'How can technology improve financial work?',work:'Use data, systems, automation, and AI to improve accounting processes and analysis.',skills:['Data','Systems','Judgment','Technology literacy'],where:'Firms, corporations, software companies, analytics teams'}
  ];
  const myths=[
    {q:'Accounting is mostly advanced math.',a:'Most accounting work relies more on logic, organization, analysis, communication, and judgment than advanced mathematics. Arithmetic matters, but it is not the defining skill.'},
    {q:'Accounting is basically bookkeeping.',a:'Bookkeeping is one part of accounting. The broader profession also includes audit, tax, transactions, advisory, investigation, systems, analytics, and many other roles.'},
    {q:'Accountants sit behind a desk all day.',a:'Some work is desk-based, but many roles involve client meetings, interviews, site visits, teamwork, presentations, investigations, and collaboration across a business.'},
    {q:'AI is going to replace accountants.',a:'AI can automate or assist with many tasks. That is different from eliminating an entire profession. Accountants still need to interpret context, evaluate evidence, communicate, exercise judgment, and remain accountable for conclusions.'},
    {q:'You have to become a CPA to use an accounting degree.',a:'CPA licensure is important for some paths, especially public accounting and certain leadership roles, but accounting graduates also work in corporate finance, transactions, consulting, technology, government, and other areas.'},
    {q:'Accounting is basically tax.',a:'Tax is one career path. Audit, forensic accounting, corporate accounting, advisory, transactions, analytics, systems, and government roles can look very different.'}
  ];
  const professionals=[
    {role:'Audit Associate',quote:'A lot of the work is asking questions, understanding the business, and figuring out why something does not make sense.',does:['Talks with clients','Reviews evidence','Tests financial information','Works with a team','Uses data tools']},
    {role:'Forensic Accountant',quote:'The interesting part is connecting separate clues and understanding the story behind the transactions.',does:['Follows transaction trails','Reviews documents','Looks for patterns','Supports investigations','Explains findings']},
    {role:'Tax Advisor',quote:'The value is not just calculating a number. It is helping someone understand how a decision changes the tax and business outcome.',does:['Researches guidance','Evaluates facts','Compares alternatives','Explains uncertainty','Makes recommendations']}
  ];

  function loadState(){try{const raw=localStorage.getItem('accountingExplorerStateV2');return raw?{...structuredClone(defaultState),...JSON.parse(raw)}:structuredClone(defaultState)}catch(e){return structuredClone(defaultState)}}
  function save(){try{localStorage.setItem('accountingExplorerStateV2',JSON.stringify(state))}catch(e){} updateProgress()}
  function reset(){if(confirm('Restart the entire experience? This will erase your progress and responses.')){state=structuredClone(defaultState);try{localStorage.removeItem('accountingExplorerStateV2')}catch(e){}go('home')}}
  function completedCount(){return experiences.filter(k=>state.completed[k]).length}
  function updateProgress(){const c=completedCount(),l=document.getElementById('miniProgressLabel'),b=document.getElementById('miniProgressBar'),wrap=document.querySelector('.progress-mini');if(wrap)wrap.style.display=state.userType==='educator'?'none':'';if(l)l.textContent=`${c} of 5 experiences completed`;if(b)b.style.width=`${c/5*100}%`}
  function render(html){document.getElementById('app').innerHTML=html;window.scrollTo({top:0,behavior:'smooth'});updateProgress()}
  function go(view){if(view!=='teachers'){document.body.classList.remove('teacher-board-mode');state.teacherPresenting=false;}const map={home:homeView,survey:studentPracticeAreasView,hub:hubView,careers:careersView,myths:mythsView,ai:aiView,industries:industriesView,professionals:professionalsView,reflection:reflectionView,results:resultsView,teachers:teachersView,bookkeeping:()=>simulationView('bookkeeping'),tax:()=>simulationView('tax'),audit:()=>simulationView('audit'),forensic:()=>simulationView('forensic')};(map[view]||homeView)()}

  function homeView(){render(`
    <section class="hero"><span class="eyebrow">Career exploration before coursework</span><h1>Don’t just read about accounting. Try the work.</h1><p>A short, teacher-led career lab that lets students investigate, question, explain, and make judgment calls before deciding whether accounting is worth exploring. No accounting knowledge required.</p>
      <div class="grid grid-2 section">
        <article class="card entry-card click-card"><div><div class="entry-icon">🧭</div><h2>I'm a student</h2><p>Try short career challenges and discover what different accountants actually do.</p></div><button class="btn btn-primary" onclick="app.setUserType('student');app.studentPracticeAreasView()">Explore Practice Areas</button></article>
        <article class="card entry-card click-card"><div><div class="entry-icon">🧑‍🏫</div><h2>I'm an educator or advisor</h2><p>Use a presentation-style guide to introduce accounting careers, show examples, lead discussion, and then send students into the interactive experience.</p></div><button class="btn btn-accent" onclick="app.setUserType('educator');app.go('teachers')">Open Presentation</button></article>
      </div>
      <div class="tagline">Investigate. Verify. Advise. Organize. Adapt.</div>
    </section>
    <section class="section"><h2>Start with a problem—not a definition.</h2><p>Pick whichever challenge sounds most interesting. You will learn which accounting career it connects to after you experience the work.</p><div class="grid grid-4">${['forensic','audit','tax','bookkeeping'].map(challengeCard).join('')}</div></section>
    <section class="section grid grid-2"><div class="accent-box"><span class="eyebrow">Why this exists</span><h2>Accounting is often encountered technically before it is understood professionally.</h2><p>This experience shows the broader profession first—investigation, evidence, decisions, technology, communication, and business context—so students can make a more informed choice.</p></div><div class="card"><span class="eyebrow">Not an aptitude test</span><h2>You are exploring, not being graded.</h2><p>Feedback explains how a professional might think through the situation. Progress rewards curiosity, evidence review, and reasoning rather than accounting knowledge you already have.</p></div></section>
  `)}
  function setUserType(t){state.userType=t;save()}
  function challengeCard(k){const m=simMeta[k];return `<article class="card challenge-card click-card" onclick="app.go('${k}')"><div class="kicker">${m.duration}</div><div class="question">${m.question}</div><div class="reveal">Career revealed after you begin</div><div class="status">${state.completed[k]?'Explored':'Start challenge'}</div></article>`}


  function studentPracticeAreasView(){
    state.userType='student';
    save();
    render(`<div class="sim-shell">
      <span class="eyebrow">Start Here</span>
      <h1 class="page-title">Accounting is not one job.</h1>
      <p class="lede">Before you try the activities, here are the main practice areas you will explore. You do not need any accounting background.</p>

      <div class="access-note">
        <strong>Think of these as different kinds of problems accountants help solve.</strong>
        The activities show you what the work feels like before introducing technical vocabulary.
      </div>

      <div class="grid grid-2 section">
        <div class="card concept-card">
          <div class="big-verb">Record</div>
          <h3>Corporate Accounting / Bookkeeping</h3>
          <p>Track the day-to-day story of a business—sales, spending, payroll, and inventory—so leaders know what is happening.</p>
          <div class="plain-language"><strong>What you will try:</strong> Decide what changed after a business event and why that matters.</div>
        </div>

        <div class="card concept-card">
          <div class="big-verb">Advise</div>
          <h3>Tax & Advisory</h3>
          <p>Help a business compare choices—such as where to expand, how a decision affects taxes, and which option makes the most sense financially.</p>
          <div class="plain-language"><strong>What you will try:</strong> Weigh trade-offs, ask for missing information, and make a recommendation you can defend.</div>
        </div>

        <div class="card concept-card">
          <div class="big-verb">Verify</div>
          <h3>Audit & Assurance</h3>
          <p>Test whether a company’s claims—like how much inventory or cash it has—can actually be supported by evidence.</p>
          <div class="plain-language"><strong>What you will try:</strong> Compare what a company says with documents, counts, and outside confirmation.</div>
        </div>

        <div class="card concept-card">
          <div class="big-verb">Investigate</div>
          <h3>Forensic Accounting</h3>
          <p>Investigate suspicious payments, missing money, or possible fraud by following records, spotting patterns, and interviewing people.</p>
          <div class="plain-language"><strong>What you will try:</strong> Decide what to investigate first and what question to ask next.</div>
        </div>

        <div class="card concept-card">
          <div class="big-verb">Evaluate</div>
          <h3>M&A / Transactions</h3>
          <p>Study whether buying or selling a company is a good deal, what the business is worth, and what risks could change the price.</p>
          <div class="plain-language"><strong>In this prototype:</strong> Explore this area through the career overview and see how similar business judgment is used.</div>
        </div>

        <div class="card concept-card">
          <div class="big-verb">Adapt</div>
          <h3>Accounting + Technology</h3>
          <p>Use dashboards, systems, analytics, and AI to spot unusual transactions, organize information, and support faster decisions.</p>
          <div class="plain-language"><strong>What you will try:</strong> See what technology can flag—and what still requires a human explanation.</div>
        </div>
      </div>

      <div class="result-box section">
        <h2>Different practice areas use different skills.</h2>
        <p>You might enjoy organizing information, evaluating evidence, solving business problems, investigating unusual activity, or working with technology.</p>
      </div>

      <div class="value-strip">
          <div><strong>Earlier.</strong><span>Designed for students before college, when perceptions are still forming.</span></div>
          <div><strong>Experiential.</strong><span>Students perform simplified versions of accounting work instead of reading career descriptions.</span></div>
          <div><strong>Human.</strong><span>Cases emphasize questioning, explaining, communication, and judgment—not just numbers.</span></div>
        </div>
        <div class="moment-card">
          <span class="lab-badge">Accounting Career Lab · 20–30 minutes</span>
          <h2>Built for a real classroom moment.</h2>
          <p>A high-school business teacher projects the experience, walks the class through short cases, and uses discussion to show what accounting work actually feels like.</p>
        </div><div class="cta-row">
        <button class="btn btn-primary" onclick="app.go('hub')">Try the Practice Areas</button>
        <button class="btn btn-secondary" onclick="app.go('careers')">Explore Careers First</button>
      </div>
    </div>`);
  }

  const preQuestions=[
    {key:'associations',prompt:'When you hear “accounting,” what comes to mind?',multi:true,options:['Taxes','Bookkeeping','Math','Spreadsheets','Business decisions','Fraud investigations','Technology','Auditing','I am not sure']},
    {key:'interest',prompt:'How interested are you in learning what accounting careers actually involve?',scale:true},
    {key:'intimidation',prompt:'How intimidating does accounting seem to you right now?',scale:true,left:'Not intimidating',right:'Very intimidating'},
    {key:'breadth',prompt:'Which sounds most like accounting to you?',options:['Recording financial transactions','Helping a business make decisions','Checking whether financial information is reliable','Investigating suspicious activity','All of the above','I am not sure']},
    {key:'ai',prompt:'How concerned are you that AI could make accounting careers less relevant?',scale:true,left:'Not concerned',right:'Very concerned'}
  ];
  function surveyView(i){if(i>=preQuestions.length){save();return hubView()}const q=preQuestions[i],v=state.preSurvey[q.key];let opts='';if(q.multi){opts=`<div class="option-list">${q.options.map(o=>`<button class="option ${(v||[]).includes(o)?'selected':''}" onclick='app.togglePre(${JSON.stringify(q.key)},${JSON.stringify(o)});app.surveyView(${i})'>${o}</button>`).join('')}</div>`}else if(q.scale){opts=`<div class="scale">${[1,2,3,4,5].map(n=>`<button class="option ${v===n?'selected':''}" onclick="app.setPre('${q.key}',${n});app.surveyView(${i})">${n}<div class="small">${n===1?(q.left||'Low'):n===5?(q.right||'High'):''}</div></button>`).join('')}</div>`}else{opts=`<div class="option-list">${q.options.map(o=>`<button class="option ${v===o?'selected':''}" onclick='app.setPre(${JSON.stringify(q.key)},${JSON.stringify(o)});app.surveyView(${i})'>${o}</button>`).join('')}</div>`}render(`<div class="question-shell"><div class="kicker">Before you explore · ${i+1} of ${preQuestions.length}</div><div class="track"><div class="fill" style="width:${(i+1)/preQuestions.length*100}%"></div></div><h2>${q.prompt}</h2>${opts}<div class="sticky-actions">${i?`<button class="btn btn-secondary" onclick="app.surveyView(${i-1})">Back</button>`:''}<button class="btn btn-primary" ${v==null||(q.multi&&!(v||[]).length)?'disabled':''} onclick="app.surveyView(${i+1})">${i===preQuestions.length-1?'Start Exploring':'Continue'}</button></div></div>`)}
  function setPre(k,v){state.preSurvey[k]=v;save()}function togglePre(k,o){const a=[...(state.preSurvey[k]||[])],idx=a.indexOf(o);if(idx>=0)a.splice(idx,1);else a.push(o);state.preSurvey[k]=a;save()}

  function hubView(){render(`<span class="eyebrow">Choose your path</span><h1 class="page-title">Which problem would you rather solve?</h1><p class="lede">There is no required order. Start with the problem that sounds most interesting, then discover the career behind it.</p><div class="grid grid-2 section">${['forensic','audit','tax','bookkeeping'].map(challengeCard).join('')}</div>
    <section class="section card"><span class="eyebrow">After the challenges</span><h2>Keep exploring the profession.</h2><div class="cta-row"><button class="btn btn-secondary" onclick="app.go('careers')">Explore More Careers</button><button class="btn btn-secondary" onclick="app.go('myths')">Test Common Perceptions</button><button class="btn btn-secondary" onclick="app.go('ai')">Explore AI & Accounting</button></div></section>`)}

  function simulationView(type){const step=state.simStep[type]||0;if(step===0)return simIntro(type);if(step===1)return simDecision(type);return simReveal(type)}
  function simIntro(type){const m=simMeta[type],content={
    forensic:{intro:'You are helping review a small entertainment company after the owner notices $14,000 is missing.',details:['A vendor was paid several times','Some invoices look unusually similar','One employee approved every payment']},
    audit:{intro:'You are on an audit team. The company says it owns 1,240 units of equipment, but the warehouse count does not match.',details:['The ledger shows 1,240 units','Warehouse count shows 1,168 units','Management says the difference is probably timing']},
    tax:{intro:'A growing apparel company wants to open a new distribution site. Two locations have different costs, incentives, and tax effects.',details:['Location A has lower rent','Location B offers a state incentive','The decision also affects payroll and logistics']},
    bookkeeping:{intro:'A campus clothing company had a busy week and its records are messy. Before anyone can make decisions, the activity needs to be organized.',details:['Sales came in online and in-store','Rent and packaging were paid','Inventory was purchased','One customer paid an old balance']}
  }[type];render(`<div class="sim-shell"><span class="eyebrow">Career challenge · ${m.verb}</span><h1 class="page-title">${m.title}</h1><div class="scenario"><h2>${m.question}</h2><p>${content.intro}</p></div><div class="grid grid-3">${content.details.map((d,i)=>`<div class="evidence"><div class="label">Clue ${i+1}</div><h3>${d}</h3><p class="muted">You do not need accounting knowledge. Just notice what seems important.</p></div>`).join('')}</div><div class="notice"><strong>Career exploration mode:</strong> You are not being graded. The goal is to experience the kind of thinking this work uses.</div><div class="cta-row"><button class="btn btn-primary" onclick="app.setSimStep('${type}',1)">What would you do next?</button></div></div>`)}
  function simDecision(type){const data={
    forensic:{prompt:'What would be the most useful next step?',opts:[['Compare the vendor payments, invoice numbers, and approver relationships','That is the investigative move: connect separate pieces of evidence instead of looking at each transaction alone.','Pattern Connector'],['Immediately accuse the employee of fraud','The pattern deserves investigation, but a professional would gather more evidence before reaching that conclusion.','Evidence First'],['Ignore the payments because each amount is small','Small transactions can still form a meaningful pattern when viewed together.','Look Across the Data']]},
    audit:{prompt:'Management says the difference is probably timing. What would you do?',opts:[['Ask for evidence that explains the missing 72 units','Auditors do not reject management explanations automatically, but they do ask for support.','Professional Skeptic'],['Accept the explanation because management knows the business','An explanation can be reasonable and still require evidence.','Evidence Seeker'],['Assume the records are fraudulent','A mismatch is a signal to investigate, not a conclusion by itself.','Balanced Judgment']]},
    tax:{prompt:'What information should drive the recommendation?',opts:[['Compare the combined business impact: costs, incentives, taxes, payroll, and operations','Tax advice often requires understanding the full business decision, not just finding the lowest tax number.','Business Thinker'],['Choose whichever location has the lowest tax rate','Tax rate matters, but it is only one input in the business decision.','Broader View'],['Choose the lower-rent location without reviewing anything else','Rent is relevant, but the recommendation should consider the broader financial and operating effects.','Decision Context']]},
    bookkeeping:{prompt:'What is the most useful first step?',opts:[['Classify what happened: sales, expenses, inventory purchases, and customer payments','Reliable accounting begins by organizing financial activity so later reporting and decisions are based on usable information.','Record Builder'],['Start with advanced journal entries','Technical entries can come later. First understand the business event and what changed.','Context First'],['Estimate the week from memory','Accounting systems exist because decisions need reliable, organized records rather than guesses.','Accuracy Matters']]}
  }[type];render(`<div class="question-shell"><span class="eyebrow">Your judgment</span><h2>${data.prompt}</h2><div class="option-list">${data.opts.map((o,i)=>`<button class="option" onclick="app.answerSim('${type}',${i},${JSON.stringify(o[1])},${JSON.stringify(o[2])})">${o[0]}</button>`).join('')}</div><div id="simFeedback"></div></div>`)}
  function answerSim(type,index,msg,badge){document.querySelectorAll('.option').forEach(x=>x.disabled=true);const fb=document.getElementById('simFeedback');fb.innerHTML=`<div class="feedback"><strong>How a professional might think about it</strong>${msg}</div><div class="sticky-actions"><button class="btn btn-primary" onclick="app.setSimStep('${type}',2)">Reveal the Career</button></div>`;if(!state.behaviors[type].includes(badge))state.behaviors[type].push(badge);save()}
  function simReveal(type){const m=simMeta[type],descs={forensic:'You just used the logic of forensic accounting: follow evidence, connect patterns, and avoid jumping from a red flag to a conclusion.',audit:'You just used professional skepticism: ask for evidence, evaluate explanations, and determine whether financial information can be trusted.',tax:'You just used tax/advisory thinking: understand the facts, compare alternatives, and evaluate the business consequences of a decision.',bookkeeping:'You just used the foundation of financial accounting: organize what happened accurately so other people can understand the business.'};render(`<div class="sim-shell"><span class="eyebrow">Career reveal</span><h1 class="page-title">That was ${m.career}.</h1><div class="result-box"><h2>${m.verb}</h2><p>${descs[type]}</p></div><div class="grid grid-2 section"><div class="card"><h3>Core skill</h3><p>${m.skill}</p></div><div class="card"><h3>Your exploration badge</h3><div class="pill pill-accent">${state.behaviors[type][0]||m.verb+' Explorer'}</div><p class="small muted">Badges recognize how you approached the problem—not prior accounting knowledge.</p></div></div><div class="cta-row"><button class="btn btn-primary" onclick="app.completeSim('${type}')">Mark Explored</button><button class="btn btn-secondary" onclick="app.go('hub')">Choose Another Challenge</button></div></div>`)}
  function setSimStep(t,s){state.simStep[t]=s;save();simulationView(t)}function completeSim(t){state.completed[t]=true;save();hubView()}

  function careersView(){const selected=state.selectedCareer;render(`<span class="eyebrow">Explore the profession</span><h1 class="page-title">Accounting careers can look very different from one another.</h1><p class="lede">The prototype uses four interactive challenges, but an accounting background can connect to a much broader set of roles.</p><div class="grid grid-4 section">${careers.map((c,i)=>`<article class="card career-card click-card" onclick="app.selectCareer(${i})"><div class="kicker">${c.tag}</div><h3>${c.name}</h3><p>${c.problem}</p><div class="skills">${c.skills.slice(0,2).map(s=>`<span class="pill">${s}</span>`).join('')}</div></article>`).join('')}</div>${selected!==null?careerDetail(careers[selected]):''}`)}

  function mythsView(){render(`<span class="eyebrow">Perceptions & reality</span><h1 class="page-title">What have you heard about accounting?</h1><p class="lede">Select a statement to see a more complete picture. The goal is not to replace one stereotype with another—it is to add context.</p><div class="grid grid-2 section">${myths.map((m,i)=>`<div class="card myth-card"><button class="link-btn" onclick="app.selectMyth(${i})"><h3>${m.q}</h3><span class="pill">Explore the claim</span></button>${state.selectedMyth===i?`<div class="myth-answer">${m.a}</div>`:''}</div>`).join('')}</div><section class="section accent-box"><h2>One useful distinction</h2><p><strong>Bookkeeping is part of accounting, but not the whole profession.</strong> Similarly, AI can automate tasks without automatically eliminating every job that contains those tasks.</p></section>`)}

  function aiView(){const step=state.aiStep||0;if(step===0)return aiIntro();if(step===1)return aiFlagCase();if(step===2)return aiMissCase();if(step===3)return aiAcross();return aiReflect()}
  function aiIntro(){render(`<div class="sim-shell"><span class="eyebrow">AI & the future of accounting</span><h1 class="page-title">AI can automate tasks. Accountants still have to understand what the output means.</h1><p class="lede">Instead of treating AI as either irrelevant or certain to replace an entire profession, this section separates task automation from professional judgment.</p><div class="grid grid-2 section"><div class="card"><h2>AI is strong at</h2><ul><li>Processing large datasets</li><li>Repetitive classification</li><li>Searching information</li><li>Pattern detection</li><li>Drafting and summarizing</li><li>Flagging anomalies</li></ul></div><div class="card"><h2>People still add</h2><ul><li>Context</li><li>Judgment</li><li>Professional skepticism</li><li>Communication</li><li>Investigation</li><li>Accountability</li></ul></div></div><div class="cta-row"><button class="btn btn-primary" onclick="app.setAIStep(1)">Try an AI Case</button></div></div>`)}
  function aiFlagCase(){render(`<div class="sim-shell"><span class="eyebrow">Mini-case 1</span><h1 class="page-title">The AI flagged something.</h1><div class="scenario"><p>An AI tool flags a $12,000 payment because it is much larger than the company's typical software payments.</p></div><div class="evidence-grid"><div class="evidence"><div class="label">Contract</div><h3>Annual enterprise software license</h3></div><div class="evidence"><div class="label">Invoice</div><h3>$12,000 — matches contract</h3></div><div class="evidence"><div class="label">Approval</div><h3>Approved by IT director and CFO</h3></div></div><h2>What did the AI do well—and what still required a person?</h2><div class="option-list"><button class="option" onclick="app.aiAnswer(1,'The AI did useful screening by surfacing something unusual. A person then used context and evidence to determine that the transaction was legitimate. A flag is not a conclusion.','AI Context Reviewer')">It identified an unusual item that deserved review</button><button class="option" onclick="app.aiAnswer(1,'The available evidence does not support calling this fraud. The important lesson is that an anomaly requires investigation and context.','Evidence Before Conclusion')">It proved the payment was fraud</button></div><div id="aiFeedback"></div></div>`)}
  function aiMissCase(){render(`<div class="sim-shell"><span class="eyebrow">Mini-case 2</span><h1 class="page-title">The AI missed something.</h1><div class="scenario"><p>The system does not flag several small vendor payments because each amount is individually normal.</p></div><div class="evidence-grid"><div class="evidence"><div class="label">Pattern</div><h3>Repeated amounts: $4,850–$4,980</h3></div><div class="evidence"><div class="label">Invoices</div><h3>Very similar numbering</h3></div><div class="evidence"><div class="label">Approvals</div><h3>Same employee every time</h3></div></div><h2>What might a person notice?</h2><div class="option-list"><button class="option" onclick="app.aiAnswer(2,'A person can connect relationships across separate pieces of information. Technology may detect many patterns, but professionals still have to understand why the pattern matters.','Cross-Context Thinker')">The relationship among the payments, invoices, and approvals</button><button class="option" onclick="app.aiAnswer(2,'Individually normal amounts can still form a suspicious pattern when combined with other evidence.','Pattern Investigator')">Nothing—the amounts are too small to matter</button></div><div id="aiFeedback"></div></div>`)}
  function aiAnswer(step,msg,badge){document.querySelectorAll('.option').forEach(x=>x.disabled=true);document.getElementById('aiFeedback').innerHTML=`<div class="feedback"><strong>What this shows</strong>${msg}</div><div class="sticky-actions"><button class="btn btn-primary" onclick="app.setAIStep(${step+1})">Continue</button></div>`;if(!state.behaviors.ai.includes(badge))state.behaviors.ai.push(badge);save()}
  function aiAcross(){render(`<span class="eyebrow">AI across the profession</span><h1 class="page-title">Different accounting roles will use AI differently.</h1><div class="grid grid-2 section">${aiArea('Bookkeeping',['Categorize transactions','Match receipts','Reconcile accounts','Find duplicates'],['Review exceptions','Correct classifications','Investigate discrepancies','Design processes'])}${aiArea('Tax',['Search guidance','Summarize rules','Organize documents','Assist calculations'],['Understand facts','Apply ambiguous rules','Evaluate alternatives','Explain risk'])}${aiArea('Audit',['Analyze large datasets','Flag unusual transactions','Automate parts of testing'],['Determine what matters','Gather evidence','Interview management','Reach conclusions'])}${aiArea('Forensic',['Identify suspicious patterns','Search communications','Analyze transactions'],['Develop theories','Connect financial and nonfinancial evidence','Conduct interviews','Communicate findings'])}</div><div class="result-box section"><h2>Future accountant = Accounting knowledge + Business understanding + Technology skills + Judgment + Communication</h2></div><div class="cta-row"><button class="btn btn-primary" onclick="app.setAIStep(4)">Reflect on AI</button></div>`)}
  function aiArea(name,ai,human){return `<div class="card"><h3>${name}</h3><p><strong>AI may help:</strong></p><ul>${ai.map(x=>`<li>${x}</li>`).join('')}</ul><p><strong>Accountants still:</strong></p><ul>${human.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
  function aiReflect(){render(`<div class="question-shell"><span class="eyebrow">Reflection</span><h1 class="page-title">How do you see AI now?</h1><p class="lede">Which statement best matches your view after the examples?</p><div class="option-list">${['AI will likely eliminate most accounting work','AI will automate some tasks and change accounting jobs','AI probably will not significantly change accounting','I am still unsure'].map(o=>`<button class="option ${state.postSurvey.aiBelief===o?'selected':''}" onclick='app.setPost(${JSON.stringify('aiBelief')},${JSON.stringify(o)});app.aiView()'>${o}</button>`).join('')}</div><div class="sticky-actions"><button class="btn btn-primary" ${!state.postSurvey.aiBelief?'disabled':''} onclick="app.completeAI()">Continue</button></div></div>`)}

  function reflectionView(){const opts=['Organizing financial information','Advising businesses','Evaluating evidence','Investigating suspicious activity','Solving transaction / deal problems','Working with technology','Communicating with clients or teams'];render(`<div class="question-shell"><span class="eyebrow">Career reflection</span><h1 class="page-title">What type of work interested you most?</h1><p class="lede">Choose up to two. This is not an aptitude test—it simply points you toward areas you may want to explore further.</p><div class="option-list">${opts.map(o=>`<button class="option ${state.favoriteAreas.includes(o)?'selected':''}" onclick='app.toggleFavorite(${JSON.stringify(o)})'>${o}</button>`).join('')}</div>${state.favoriteAreas.length?careerSuggestions():''}<div class="sticky-actions"><button class="btn btn-primary" ${!state.favoriteAreas.length?'disabled':''} onclick="app.postSurveyView(0)">Continue to Final Reflection</button></div></div>`)}
  function toggleFavorite(o){const a=[...state.favoriteAreas],i=a.indexOf(o);if(i>=0)a.splice(i,1);else if(a.length<2)a.push(o);else return alert('Choose up to two.');state.favoriteAreas=a;save();reflectionView()}
  function careerSuggestions(){const map={'Organizing financial information':['Corporate accounting','Financial reporting','Accounting operations'],'Advising businesses':['Tax','Advisory'],'Evaluating evidence':['External audit','Internal audit','Assurance'],'Investigating suspicious activity':['Forensic accounting','Fraud examination','Government investigations'],'Solving transaction / deal problems':['M&A / Transactions','Deal advisory','Valuation-related work'],'Working with technology':['Accounting analytics','Accounting systems','Technology-enabled audit'],'Communicating with clients or teams':['Audit','Tax advisory','Consulting','Client service roles']};const set=[...new Set(state.favoriteAreas.flatMap(x=>map[x]||[]))];return `<div class="card section"><h3>You may want to explore:</h3><div class="cta-row">${set.map(x=>`<span class="pill pill-accent">${x}</span>`).join('')}</div></div>`}

  function teacherCaseState(id){
    state.teacherCases=state.teacherCases||{};
    state.teacherCases[id]=state.teacherCases[id]||{stage:0,choices:[]};
    return state.teacherCases[id];
  }
  function teacherCaseChoose(id,stage,choice){

    c.choices=c.choices||[];

  }

  function accountantDid(title,didItems,notItems,skills){

  function teacherBookkeepingCase(){
    const c=teacherCaseState('bookkeeping');
    if(c.stage===0)return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">60-second class example</span><h3>Campus Threads pays $2,000 for shirts it plans to sell later.</h3><p>No accounting vocabulary is required. Just ask what happened to the business.</p></div><div class="teacher-case-body"><div class="teacher-case-question">What happened?</div>${teacherCaseButtons('bookkeeping',1,[{label:'The company has less cash, but now has shirts it can sell',value:'inventory'},{label:'The company earned $2,000',value:'revenue'},{label:'The company made $2,000 of profit',value:'profit'}])}</div></div>`;
    const choice=c.choices[0];
    const msg=choice==='inventory'
      ?'Exactly. The business traded cash for something it now owns and plans to sell later.'
      :'The purchase itself did not create sales or profit. The business used cash to buy products it expects to sell later.';
    return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Bookkeeping foundation</span><h3>Start with what happened. Name the accounting concept afterward.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>What the class just figured out</h4><p>${msg}</p></div><div class="plain-language"><strong>Accounting reveal:</strong> Accountants call the shirts <span class="term" title="Products a business owns and plans to sell">inventory</span>. Inventory is one kind of <span class="term" title="Something a business owns or controls that has value">asset</span>.</div><details class="optional-accounting"><summary>Optional: show the accounting language</summary><div class="optional-body">If students already know some accounting, you can explain that cash decreased while inventory increased. Debits and credits are intentionally not required for this experience.</div></details><div class="teacher-skill-reveal"><h3>You just used the recordkeeping foundation of accounting.</h3><p>Students understood the business event first. The terminology came second.</p></div>${teacherResetButton('bookkeeping')}</div></div>`;
  }

  function teacherForensicCase(){
    const c=teacherCaseState('forensic');
    if(c.stage===0)return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Whole-class micro-simulation</span><h3>$14,000 is missing from a music company.</h3><p>The class is the investigation team. Decide where to start.</p></div><div class="teacher-case-body"><div class="teacher-case-question">Where would you look first?</div>${teacherCaseButtons('forensic',1,[{label:'Vendor payments',value:'vendor'},{label:'Employee reimbursements',value:'reimbursements'},{label:'Customer payments',value:'revenue'}])}<div class="reasoning-step"><h4>Before the teacher clicks</h4><p>Ask one or two students: <strong>Why did you choose that?</strong></p></div></div></div>`;
    if(c.stage===1){const first=c.choices[0];const reveal=first==='vendor'?'You find five payments between $4,850 and $4,980 to the same new vendor.':first==='reimbursements'?'The reimbursements have receipts, travel dates, and supervisor approvals. Nothing obvious stands out.':'Customer invoices match the money deposited into the company’s bank account.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="teacher-step">Step 2</span><h3>Follow the evidence.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>What your first choice uncovered</h4><p>${reveal}</p></div><div class="dialogue"><span class="speaker">Employee</span><p>“That vendor has worked with us for a while. I think you’re making this into something it isn’t.”</p></div><div class="teacher-case-question">What is the best next question?</div>${teacherCaseButtons('forensic',2,[{label:'“Can you explain how this vendor was selected?”',value:'open'},{label:'“Did you steal the money?”',value:'accuse'},{label:'“Why should we believe you?”',value:'hostile'}])}<div class="reasoning-step"><h4>Defend the class choice</h4><p>What would this question help you learn? What risk comes from accusing someone too early?</p></div>${teacherResetButton('forensic')}</div></div>`;}
    if(c.stage===2){const second=c.choices[1];const reveal=second==='open'?'The employee explains that they recommended the vendor. The vendor record uses the same phone number as the employee’s emergency contact.':'The employee becomes defensive and gives very little useful information. The team still needs facts, not an accusation.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="teacher-step">Step 3</span><h3>Now the pattern is stronger.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>What happened</h4><p>${reveal}</p></div><div class="teacher-case-question">What conclusion is strongest right now?</div>${teacherCaseButtons('forensic',3,[{label:'Fraud is proven',value:'proven'},{label:'There is enough concern to investigate the relationship further',value:'investigate'},{label:'Nothing unusual happened',value:'nothing'}])}<div class="reasoning-step"><h4>Why?</h4><p>Ask students what evidence supports their choice—and what they still do not know.</p></div>${teacherResetButton('forensic')}</div></div>`;}
    const final=c.choices[2];const msg=final==='investigate'?'That is the strongest professional response. The evidence supports continued investigation, but intent and responsibility still need to be established.':'The evidence is concerning, but a professional would not jump straight to “case closed.” More evidence is needed before asserting fraud or dismissing the issue.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Career reveal</span><h3>You just worked like a forensic accountant.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>Reasoning check</h4><p>${msg}</p></div>${accountantDid('What did the accountant actually do?',['noticed an unusual pattern','asked a neutral follow-up question','connected financial and nonfinancial evidence','held back from accusing someone too early'],['debits and credits','advanced math','a journal entry'],['Investigation','Communication','Judgment','Pattern recognition'])}${teacherResetButton('forensic')}</div></div>`;
  }

  function teacherAuditCase(){
    const c=teacherCaseState('audit');
    if(c.stage===0)return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Whole-class micro-simulation</span><h3>Campus Threads says it has $520,000 of products.</h3><p>Employees counted only $438,000 in the main warehouse.</p></div><div class="teacher-case-body"><div class="dialogue"><span class="speaker">Warehouse manager</span><p>“That’s normal. Some products are stored offsite. We really don’t need to spend more time on this.”</p></div><div class="teacher-case-question">How should the auditor respond?</div>${teacherCaseButtons('audit',1,[{label:'“Okay, that explanation makes sense.”',value:'accept'},{label:'“Can you show us records from the offsite warehouse?”',value:'evidence'},{label:'“Then the $520,000 number must be wrong.”',value:'wrong'}])}<div class="reasoning-step"><h4>Before the reveal</h4><p>Ask: what is the difference between an explanation and evidence?</p></div></div></div>`;
    if(c.stage===1){const choice=c.choices[0];const lead=choice==='evidence'?'The class asked for support before reaching a conclusion.':choice==='accept'?'The explanation might be true, but an auditor still needs evidence.':'The count creates a question, but the auditor should gather evidence before changing the number.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="teacher-step">Step 2</span><h3>The offsite warehouse responds.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>Your first decision</h4><p>${lead}</p></div><div class="teacher-case-evidence"><div><strong>Offsite confirmation</strong>$76,000 of products</div><div><strong>Total supported</strong>$514,000</div><div><strong>Difference remaining</strong>$6,000</div></div><div class="dialogue"><span class="speaker">Manager</span><p>“It’s only $6,000. Can we move on now?”</p></div><div class="teacher-case-question">What should the auditor say?</div>${teacherCaseButtons('audit',2,[{label:'“First, we need to understand what the $6,000 difference is.”',value:'difference'},{label:'“Yes, most of the number is supported.”',value:'moveon'},{label:'“No. This proves management is hiding something.”',value:'accuse'}])}<div class="reasoning-step"><h4>Defend the reasoning</h4><p>What would you need to know before deciding whether the remaining difference matters?</p></div>${teacherResetButton('audit')}</div></div>`;}
    const final=c.choices[1];const msg=final==='difference'?'Exactly. The auditor keeps asking questions until the remaining difference is understood and the evidence is sufficient.':'The key is not automatically accepting or accusing. The auditor has to understand the remaining difference and decide whether more work is needed.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Career reveal</span><h3>You just worked like an auditor.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>Reasoning check</h4><p>${msg}</p></div>${accountantDid('What did the accountant actually do?',['questioned an explanation','asked for outside evidence','followed up on a remaining difference','explained why more support was needed'],['advanced equations','memorizing standards','a debit or credit'],['Communication','Evidence evaluation','Judgment','Questioning mindset'])}${teacherResetButton('audit')}</div></div>`;
  }

  function teacherAdvisoryCase(){
    const c=teacherCaseState('advisory');
    if(c.stage===0)return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Whole-class micro-simulation</span><h3>A gaming startup needs a new office.</h3><p>The owners ask the accounting team which location makes more business sense.</p></div><div class="teacher-case-body"><table class="comparison-table"><tr><th></th><th>Location A</th><th>Location B</th></tr><tr><td>Annual rent</td><td>$80,000</td><td>$110,000</td></tr><tr><td>Annual payroll</td><td>$450,000</td><td>$430,000</td></tr><tr><td>Tax incentive</td><td>$0</td><td>$75,000</td></tr><tr><td>Talent pool</td><td>Smaller</td><td>Larger</td></tr></table><div class="teacher-case-question" style="margin-top:18px">What would you recommend right now?</div>${teacherCaseButtons('advisory',1,[{label:'Location A',value:'A'},{label:'Location B',value:'B'},{label:'We need more information before recommending either',value:'more'}])}<div class="reasoning-step"><h4>Why?</h4><p>Ask the class which fact is driving their recommendation—and what might be missing.</p></div></div></div>`;
    if(c.stage===1){const first=c.choices[0];const response=first==='more'?'Good instinct: the first table does not tell the whole story.':'That could become the recommendation, but the accounting team needs enough context to defend it.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="teacher-step">Step 2</span><h3>The client pushes back.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>Your first decision</h4><p>${response}</p></div><div class="dialogue"><span class="speaker">Founder</span><p>“Location B costs more, but I need access to software engineers. Are you only looking at the tax savings?”</p></div><div class="teacher-case-evidence"><div><strong>Incentive term</strong>Location B’s $75,000 incentive lasts one year</div><div><strong>Hiring need</strong>20 developers planned</div><div><strong>Growth plan</strong>At least five years in the new office</div></div><div class="teacher-case-question">How should the accounting team respond?</div>${teacherCaseButtons('advisory',2,[{label:'“We should compare the five-year cost and the hiring impact before recommending.”',value:'longterm'},{label:'“The tax incentive makes Location B the answer.”',value:'taxonly'},{label:'“Cheaper rent means Location A is the answer.”',value:'rentonly'}])}<div class="reasoning-step"><h4>Explain it like an adviser</h4><p>Ask a student to explain the recommendation to the founder in one sentence.</p></div>${teacherResetButton('advisory')}</div></div>`;}
    const final=c.choices[1];const msg=final==='longterm'?'Exactly. A useful recommendation connects the financial effects with the company’s hiring and growth needs.':'A single tax benefit or rent figure is only one input. Advisers connect financial information with the client’s broader business facts.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Career reveal</span><h3>You just worked like a tax or business adviser.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>Reasoning check</h4><p>${msg}</p></div>${accountantDid('What did the accountant actually do?',['compared alternatives','asked for missing facts','considered a longer time horizon','explained a recommendation to a client'],['filling out a tax return','advanced math','memorizing tax forms'],['Business judgment','Communication','Analysis','Decision-making'])}${teacherResetButton('advisory')}</div></div>`;
  }

  function teacherAICase(){
    const c=teacherCaseState('teacher_ai');
    if(c.stage===0)return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Whole-class AI case</span><h3>AI flags a $12,000 software payment as unusual.</h3><p>It is much larger than the company’s usual software payments.</p></div><div class="teacher-case-body"><div class="teacher-case-question">What should happen next?</div>${teacherCaseButtons('teacher_ai',1,[{label:'Treat the flag as proof that something is wrong',value:'fraud'},{label:'Gather evidence and understand the transaction',value:'investigate'},{label:'Ignore the flag because AI can be wrong',value:'ignore'}])}<div class="reasoning-step"><h4>Why?</h4><p>Ask the class what AI has actually told you—and what it has not told you.</p></div></div></div>`;
    if(c.stage===1){const first=c.choices[0];const msg=first==='investigate'?'The class treated the AI output as a lead rather than a conclusion.':'A flag is neither proof nor something to dismiss. It tells the accountant where attention may be useful.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="teacher-step">Step 2</span><h3>Review the context.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>First decision</h4><p>${msg}</p></div><div class="teacher-case-evidence"><div><strong>Contract</strong>12-month enterprise software license</div><div><strong>Invoice</strong>$12,000, matching the contract</div><div><strong>Approval</strong>IT director and CFO</div></div><div class="teacher-case-evidence"><div><strong>Prior year</strong>$11,500 annual payment</div><div><strong>Vendor</strong>Known software provider</div><div><strong>Timing</strong>Annual renewal date</div></div><div class="teacher-case-question">What does the evidence support?</div>${teacherCaseButtons('teacher_ai',2,[{label:'Likely a legitimate annual payment',value:'legit'},{label:'Proven fraud',value:'fraud'},{label:'The AI failed',value:'failure'}])}<div class="reasoning-step"><h4>Explain your conclusion</h4><p>Ask: which pieces of evidence matter most?</p></div>${teacherResetButton('teacher_ai')}</div></div>`;}
    if(c.stage===2){const conclusion=c.choices[1];const msg=conclusion==='legit'?'The transaction looked unusual compared with monthly activity, but the evidence explains why.':'The AI was useful because it surfaced an unusual item. The human work is deciding what that unusual item means.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="teacher-step">Step 3</span><h3>Now explain the judgment.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>What the evidence supports</h4><p>${msg}</p></div><div class="dialogue"><span class="speaker">Your manager</span><p>“The system flagged this. Why are you comfortable clearing it?”</p></div><div class="teacher-case-question">What is the best explanation?</div>${teacherCaseButtons('teacher_ai',3,[{label:'“The contract, invoice, approvals, prior-year payment, and renewal date all support the transaction.”',value:'evidence'},{label:'“Because the AI is probably wrong.”',value:'aiwrong'},{label:'“Because I have a good feeling about it.”',value:'feeling'}])}<div class="reasoning-step"><h4>Defend the reasoning</h4><p>Why is an explanation tied to evidence stronger than simply disagreeing with the technology?</p></div>${teacherResetButton('teacher_ai')}</div></div>`;}
    const final=c.choices[2];const msg=final==='evidence'?'Exactly. The accountant can explain the conclusion using evidence and remains responsible for that judgment.':'The strongest explanation connects the conclusion to evidence. “AI was wrong” is not enough.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Career reveal</span><h3>AI changed the workflow; it did not finish the judgment.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>Reasoning check</h4><p>${msg}</p></div>${accountantDid('What did the accountant actually do?',['used AI to surface an unusual item','gathered context and evidence','overrode a flag for a reason','explained and took responsibility for the conclusion'],['blindly trusting the software','ignoring the software','advanced coding'],['Technology literacy','Judgment','Communication','Accountability'])}${teacherResetButton('teacher_ai')}</div></div>`;
  }

  const teacherSlides=[
    {label:'Accounting Career Lab',title:'Don’t just read about accounting. Try the work.',body:`<p class="present-quote">For the next 20–30 minutes, you are going to investigate, question, explain, and make judgment calls like accountants do.</p><div class="present-callout"><strong>No accounting class required.</strong> We will start with ordinary business situations and introduce accounting terms only after the ideas make sense.</div>`},
    {label:'Practice areas',title:'Accounting is not one job.',body:`<div class="present-grid present-grid-3"><div class="present-tile"><span class="kicker">Record</span><h3>Corporate / Bookkeeping</h3><p>Track sales, spending, payroll, and inventory so a business knows what is happening.</p></div><div class="present-tile"><span class="kicker">Advise</span><h3>Tax / Advisory</h3><p>Compare choices like where to expand and explain the financial trade-offs behind a recommendation.</p></div><div class="present-tile"><span class="kicker">Verify</span><h3>Audit</h3><p>Test whether claims about cash, inventory, or other numbers can be supported by evidence.</p></div><div class="present-tile"><span class="kicker">Investigate</span><h3>Forensic Accounting</h3><p>Follow suspicious payments or missing money by analyzing records and talking to people.</p></div><div class="present-tile"><span class="kicker">Evaluate</span><h3>M&A / Transactions</h3><p>Study whether a company is a good deal, what it is worth, and what risks could change the price.</p></div><div class="present-tile"><span class="kicker">Adapt</span><h3>Technology & Analytics</h3><p>Use data, systems, and AI to spot unusual items and support decisions faster.</p></div></div>`},
    {label:'60-second baseline',title:'Yes, accounting starts with accurate records. But that is only the beginning.',body:()=>teacherBookkeepingCase()},
    {label:'Investigate',title:'Forensic accounting: follow the money—and talk to people.',body:()=>teacherForensicCase()},
    {label:'Verify',title:'Audit: challenge an explanation without jumping to a conclusion.',body:()=>teacherAuditCase()},
    {label:'Advise',title:'Tax & advisory: make a recommendation you can defend.',body:()=>teacherAdvisoryCase()},
    {label:'Adapt',title:'AI: use the technology, then explain the judgment.',body:()=>teacherAICase()},
    {label:'What changed?',title:'The work was not just numbers. It was people, evidence, and judgment.',body:`<div class="present-grid present-grid-3"><div class="present-tile"><h3>Argue</h3><p>Challenge an explanation respectfully when the evidence does not yet support it.</p></div><div class="present-tile"><h3>Explain</h3><p>Tell a manager, client, or teammate why your conclusion makes sense.</p></div><div class="present-tile"><h3>Judge</h3><p>Decide when you have enough information—and when you still need more.</p></div><div class="present-tile"><h3>Investigate</h3><p>Ask questions and connect information when something does not make sense.</p></div><div class="present-tile"><h3>Advise</h3><p>Compare options and help someone make a business decision.</p></div><div class="present-tile"><h3>Use technology</h3><p>Let tools surface information, then decide what that information actually means.</p></div></div>`},
    {label:'Career connection',title:'Those behaviors show up across the profession.',body:`<div class="present-grid present-grid-3"><div class="present-tile"><span class="kicker">Audit</span><h3>Evidence + communication</h3><p>Question, verify, explain.</p></div><div class="present-tile"><span class="kicker">Forensic</span><h3>Investigation + interviewing</h3><p>Follow clues and test theories.</p></div><div class="present-tile"><span class="kicker">Tax / Advisory</span><h3>Analysis + recommendation</h3><p>Evaluate alternatives and advise clients.</p></div><div class="present-tile"><span class="kicker">M&A / Transactions</span><h3>Business analysis + risk</h3><p>Understand companies and deals.</p></div><div class="present-tile"><span class="kicker">Corporate</span><h3>Information + decisions</h3><p>Build reliable information businesses use.</p></div><div class="present-tile"><span class="kicker">Technology</span><h3>Data + judgment</h3><p>Use systems and AI without outsourcing responsibility.</p></div></div>`},
    {label:'Debrief',title:'Does this look like the accounting you pictured at the beginning?',body:`<div class="present-grid"><div class="present-tile"><h3>Discuss</h3><ul><li>Which case felt least like your original picture of accounting?</li><li>Where did communication matter most?</li><li>Which judgment call was hardest?</li><li>Which practice area would you want to try in more depth?</li></ul></div><div class="present-tile"><h3>Remember</h3><ul><li>Bookkeeping is one part of the profession.</li><li>Different accounting careers use different skills.</li><li>Technology changes the work, but people still interpret and explain.</li><li>The goal is not to convince you to choose accounting—it is to help you make an informed decision.</li></ul></div></div>`},
    {label:'High-school research gap',title:'One last question: did this change what accounting looks like to you?',body:`<div class="research-gap"><h3>Why we are asking</h3><p>Accounting career research often studies students after they reach college. That misses people who may have ruled accounting out earlier. Experiences like this help us understand what happens before that drop-off.</p></div><div class="present-callout"><strong>Exit prompt:</strong> Name two types of accounting work you did not know about before today. Then decide: does accounting seem more, less, or equally worth exploring?</div>`}
  ];

  function teachersView(){
    state.userType='educator';
    save();
    if(!state.teacherPresenting){
      document.body.classList.remove('teacher-board-mode');
      render(`<div class="teacher-prep">
        <div class="teacher-prep-hero">
          <span class="eyebrow">Teacher / Advisor Mode</span>
          <span class="lab-badge">Accounting Career Lab · 20–30 minutes · No prep required</span>
          <h1>Walk the class through what accounting work actually feels like.</h1>
          <p class="lede">This is designed for a high-school business teacher with one class period and students who may know almost nothing about accounting. Project it on the board, let students make decisions together, ask them to defend their reasoning, and reveal what happens next.</p>
          <div class="research-gap"><h3>Why this moment matters</h3><p>Most accounting-specific career evidence is gathered after students reach college. This experience intentionally targets the earlier point—before students may already have ruled accounting out.</p></div>
        </div>
        <div class="teacher-prep-grid">
          <div class="teacher-prep-card"><h3>Earlier</h3><p>Designed for the high-school decision window, before technical coursework becomes a student’s main picture of accounting.</p></div>
          <div class="teacher-prep-card"><h3>Experiential</h3><p>Students do simplified versions of the work: investigate, verify, advise, and evaluate technology output.</p></div>
          <div class="teacher-prep-card"><h3>Human</h3><p>Every major case includes a person to question, explain to, challenge, or advise—showing the communication and judgment that career materials can miss.</p></div>
        </div>
        <section class="section card">
          <h2>Suggested flow</h2>
          <p><strong>Practice Areas → 60-second Recordkeeping Baseline → Forensic → Audit → Tax/Advisory → AI → Human Skills → Career Connection → Debrief</strong></p>
          <p class="muted">Approximate presentation time: 20–30 minutes depending on discussion. No accounting preparation is required.</p>
        </section>
        <section class="section card">
          <h2>Optional pilot measurement</h2>
          <p>Because the research gap is specifically about the high-school drop-off point, collect only a few lightweight before/after observations. Keep them separate from the student simulation so the experience still starts with the work.</p>
          <div class="measurement-card"><strong>Before the lab</strong><div class="measurement-question">“What do you think accountants primarily do?”</div></div>
          <div class="measurement-card"><strong>After the lab</strong><div class="measurement-question">“Name two types of accounting work you did not know about before today.”</div><div class="measurement-question">“Does accounting seem more, less, or equally worth exploring after the activity?”</div></div>
        </section>
        <section class="section card">
          <h2>Facilitation cues</h2>
          <div class="grid grid-2">
            <div><strong>Before clicking</strong><p>Ask students to explain why they chose an option.</p></div>
            <div><strong>After a reveal</strong><p>Ask what the new information changes.</p></div>
            <div><strong>When a technical term appears</strong><p>Explain the plain-English idea first, then name the accounting term.</p></div>
            <div><strong>When there is uncertainty</strong><p>Emphasize that accountants often need more evidence before reaching a conclusion.</p></div>
          </div>
        </section>
        <div class="teacher-prep-actions">
          <button class="btn btn-primary" onclick="app.startTeacherPresentation()">Present to Class</button>
          <button class="btn btn-secondary" onclick="app.startStudentExperience()">Open Individual Student Experience</button>
        </div>
      </div>`);
      return;
    }
    document.body.classList.add('teacher-board-mode');
    const i=Math.max(0,Math.min(state.teacherSlide||0,teacherSlides.length-1));
    const slide=teacherSlides[i];
    const body=typeof slide.body==='function'?slide.body():slide.body;
    render(`<div class="board-shell">
      <div class="board-top">
        <div class="board-brand">Accounting Explorer</div>
        <div class="board-meta"><span>${slide.label}</span><span>${i+1} / ${teacherSlides.length}</span><button class="board-exit" onclick="app.exitTeacherPresentation()">Exit presentation</button></div>
      </div>
      <main class="board-stage">
        <div class="present-label">${slide.label}</div>
        <h1>${slide.title}</h1>
        ${body}
      </main>
      <div class="board-controls">
        <div class="board-nav-group">
          <button class="btn btn-secondary" ${i===0?'disabled':''} onclick="app.teacherPrev()">← Back</button>
          <button class="btn btn-primary" ${i===teacherSlides.length-1?'disabled':''} onclick="app.teacherNext()">Next →</button>
        </div>
        <div class="board-progress">${teacherSlides.map((_,n)=>`<span class="${n===i?'active':''}"></span>`).join('')}</div>
        <div class="board-teacher-hint">Teacher controls the screen. Let students discuss before selecting the class answer.</div>
      </div>
    </div>`);
  }
  function startTeacherPresentation(){
    state.teacherPresenting=true;
    state.teacherSlide=0;
    state.teacherCases={};
    save();
    teachersView();
  }
  function exitTeacherPresentation(){
    state.teacherPresenting=false;
    document.body.classList.remove('teacher-board-mode');
    save();
    teachersView();
  }
  function teacherNext(){state.teacherSlide=Math.min((state.teacherSlide||0)+1,teacherSlides.length-1);save();teachersView()}
  function teacherPrev(){state.teacherSlide=Math.max((state.teacherSlide||0)-1,0);save();teachersView()}
  function startStudentExperience(){state.teacherPresenting=false;document.body.classList.remove('teacher-board-mode');state.userType='student';save();studentPracticeAreasView()}

  return {go,reset,setUserType,surveyView,setPre,togglePre,setSimStep,answerSim,completeSim,selectCareer,selectMyth,setAIStep,aiView,aiAnswer,setPost,completeAI,selectIndustry,toggleFavorite,postSurveyView,teacherNext,teacherPrev,startTeacherPresentation,exitTeacherPresentation,startStudentExperience,studentPracticeAreasView,teacherCaseChoose,teacherCaseReset};
})();
document.addEventListener('DOMContentLoaded',()=>app.go('home'));
</script>
</body>
</html>
