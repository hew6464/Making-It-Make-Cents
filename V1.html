<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accounting Explorer</title>
  <style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:#182230}button,input,select{font:inherit}.topbar{position:sticky;top:0;z-index:20;display:flex;gap:24px;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid #e7ebf0;box-shadow:0 2px 10px rgba(0,0,0,.04)}.brand{display:flex;gap:12px;align-items:center;cursor:pointer;min-width:300px}.logo-mark{width:42px;height:42px;border-radius:12px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800}.brand-name{font-weight:800}.brand-sub{font-size:12px;color:#6b7280}.topbar nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.topbar nav button,.link-btn{border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;color:#374151}.topbar nav button:hover,.link-btn:hover{background:#f1f5f9}.progress-mini{min-width:180px}.progress-mini span{font-size:12px;color:#6b7280}.progress-track{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:5px}.progress-fill{height:100%;background:#111827;width:0%;transition:width .35s ease}.app-shell{max-width:1120px;margin:0 auto;padding:42px 20px 80px}.hero{padding:58px 0 28px}.eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#4b5563;background:#e9eef5;padding:7px 10px;border-radius:999px}.hero h1,.page-title{font-size:clamp(38px,6vw,72px);line-height:.98;margin:18px 0;letter-spacing:-.04em}.page-title{font-size:clamp(36px,5vw,58px)}.hero p,.lede{font-size:19px;line-height:1.6;color:#52606d;max-width:760px}.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:750;cursor:pointer;transition:.18s ease}.btn:hover{transform:translateY(-1px)}.btn-primary{background:#111827;color:#fff}.btn-secondary{background:#fff;color:#111827;border:1px solid #d9dee6}.btn-soft{background:#e9eef5;color:#182230}.btn-danger{background:#7f1d1d;color:#fff}.grid{display:grid;gap:18px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:#fff;border:1px solid #e3e8ef;border-radius:18px;padding:22px;box-shadow:0 7px 24px rgba(20,29,43,.05)}.card h3{margin-top:0}.sim-card{cursor:pointer;transition:.2s ease;position:relative;overflow:hidden}.sim-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(20,29,43,.09)}.sim-card .verb{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#667085}.sim-card .status{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eef2f7;font-size:12px;font-weight:700;margin-top:12px}.section{margin-top:44px}.section h2{font-size:30px;letter-spacing:-.02em;margin-bottom:10px}.section p{color:#5d6978;line-height:1.6}.concept-card{min-height:190px}.concept-card .big-verb{font-size:26px;font-weight:900;margin-bottom:8px}.question-shell{max-width:760px;margin:40px auto}.question-number{font-size:13px;font-weight:800;color:#667085}.question-shell h2{font-size:34px;line-height:1.15}.option-list{display:grid;gap:12px;margin-top:22px}.option{background:#fff;border:1px solid #dfe5ec;border-radius:14px;padding:16px 18px;cursor:pointer;text-align:left;transition:.15s ease}.option:hover{border-color:#94a3b8;transform:translateY(-1px)}.option.selected{border-color:#111827;box-shadow:0 0 0 2px #111827 inset}.option.correct{border-color:#15803d;background:#f0fdf4}.option.incorrect{border-color:#b91c1c;background:#fef2f2}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.scale .option{text-align:center}.sim-shell{max-width:900px;margin:0 auto}.sim-top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.sim-top .meta{color:#667085;font-size:13px}.scenario{background:#111827;color:#fff;border-radius:20px;padding:26px;margin:18px 0}.scenario h3{margin-top:0}.feedback{border-radius:14px;padding:16px 18px;margin-top:16px;background:#eef2f7}.feedback.good{background:#ecfdf3;border:1px solid #b7ebc6}.feedback.warn{background:#fff7ed;border:1px solid #fed7aa}.evidence-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0}.evidence{background:#fff;border:1px solid #dfe5ec;border-radius:14px;padding:16px;cursor:pointer;min-height:150px}.evidence:hover{border-color:#98a2b3}.evidence .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#667085;font-weight:800}.badge{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;background:#111827;color:#fff;font-weight:800;font-size:13px}.comparison-table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0}.comparison-table th,.comparison-table td{padding:14px 16px;text-align:left;border-bottom:1px solid #edf0f4}.comparison-table th{background:#f8fafc}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:700}.industry-card{cursor:pointer}.industry-card:hover{border-color:#94a3b8}.industry-detail{margin-top:24px}.result-delta{font-size:46px;font-weight:900}.result-box{background:#111827;color:#fff;border-radius:20px;padding:26px}.teacher-plan{border-left:4px solid #111827}.muted{color:#667085}.small{font-size:13px}.danger{color:#991b1b!important}.inline-note{padding:12px 14px;border-radius:12px;background:#f8fafc;border:1px solid #e5e7eb}.top-gap{margin-top:22px}.center{text-align:center}footer{border-top:1px solid #e5e7eb;background:#fff;padding:28px 24px;color:#667085;display:grid;gap:10px;text-align:center}.footer-actions{display:flex;justify-content:center;gap:12px}.tagline{font-size:24px;font-weight:850;margin-top:20px}.big-number{font-size:58px;font-weight:900}.sticky-actions{position:sticky;bottom:18px;display:flex;justify-content:flex-end;gap:10px;padding-top:18px}.hidden{display:none!important}@media(max-width:900px){.topbar{align-items:flex-start;flex-direction:column}.brand{min-width:0}.topbar nav{justify-content:flex-start}.progress-mini{width:100%}.grid-4,.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}.evidence-grid{grid-template-columns:1fr}.hero{padding-top:30px}}@media(max-width:640px){.app-shell{padding:28px 15px 60px}.topbar{padding:12px 15px}.brand-sub{display:none}.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.scale{grid-template-columns:1fr}.hero h1,.page-title{font-size:42px}.question-shell h2{font-size:28px}.cta-row,.sticky-actions{flex-direction:column}.btn{width:100%}.comparison-table{font-size:13px}.comparison-table th,.comparison-table td{padding:10px}.topbar nav{display:none}}</style>
</head>
<body>
  <header class="topbar">
    <div class="brand" onclick="app.go('home')">
      <div class="logo-mark">AE</div>
      <div>
        <div class="brand-name">Accounting Explorer</div>
        <div class="brand-sub">Experience accounting before deciding whether it's for you.</div>
      </div>
    </div>
    <nav>
      <button onclick="app.go('home')">Home</button>
      <button onclick="app.go('hub')">Simulations</button>
      <button onclick="app.go('ai')">AI & Accounting</button>
      <button onclick="app.go('industries')">Industries</button>
      <button onclick="app.go('teachers')">For Teachers</button>
    </nav>
    <div class="progress-mini">
      <span id="miniProgressLabel">0 of 5 completed</span>
      <div class="progress-track"><div id="miniProgressBar" class="progress-fill"></div></div>
    </div>
  </header>

  <main id="app" class="app-shell"></main>

  <footer>
    <div>Accounting Explorer · Career exploration prototype</div>
    <div class="footer-actions">
      <button class="link-btn" onclick="app.go('teachers')">For Teachers</button>
      <button class="link-btn danger" onclick="app.reset()">Restart Experience</button>
    </div>
    <small>This prototype is for educational and career-exploration purposes only.</small>
  </footer>

  <script>const app = (() => {
  const defaultState = {
    preSurvey: {},
    postSurvey: {},
    completed: { bookkeeping:false, tax:false, audit:false, forensic:false, ai:false },
    scores: { bookkeeping:0, tax:0, audit:0, forensic:0, ai:0 },
    badges: [],
    reflections: {},
    favoriteAreas: [],
    selectedIndustry: null,
    simulationStep: {}
  };

  let state = loadState();
  let currentView = 'home';

  const experiences = ['bookkeeping','tax','audit','forensic','ai'];

  const industries = {
    "Sports": {
      bookkeeping:"Track team, venue, ticketing, and event financial activity.",
      tax:"Help athletes or franchises understand tax and business decisions.",
      audit:"Verify financial information for teams, leagues, and venues.",
      forensic:"Investigate misuse of organization funds or suspicious payments.",
      ai:"Analyze ticketing, payroll, and transaction data for unusual patterns."
    },
    "Music": {
      bookkeeping:"Track revenue and expenses for artists, venues, and record labels.",
      tax:"Advise artists and entertainment companies on tax decisions.",
      audit:"Verify financial information for music and media companies.",
      forensic:"Investigate royalty discrepancies or missing funds.",
      ai:"Analyze royalty and payment data for unusual trends."
    },
    "Gaming": {
      bookkeeping:"Track digital sales, subscriptions, and development costs.",
      tax:"Evaluate tax implications of studios operating across locations.",
      audit:"Test revenue, deferred revenue, and transaction data.",
      forensic:"Investigate payment abuse, vendor fraud, or misuse of funds.",
      ai:"Analyze massive transaction datasets and flag anomalies."
    },
    "Fashion": {
      bookkeeping:"Track inventory, sales, returns, and operating expenses.",
      tax:"Support expansion, sourcing, and tax planning decisions.",
      audit:"Test inventory and sales records.",
      forensic:"Investigate vendor or procurement fraud.",
      ai:"Identify unusual purchasing or sales patterns."
    },
    "Technology": {
      bookkeeping:"Track software sales, subscriptions, and operating costs.",
      tax:"Research credits, incentives, and international tax issues.",
      audit:"Evaluate revenue, expenses, and financial controls.",
      forensic:"Investigate insider misconduct or suspicious payments.",
      ai:"Automate data processing and support complex analysis."
    },
    "Movies & Entertainment": {
      bookkeeping:"Track production budgets, distribution revenue, and expenses.",
      tax:"Advise productions on incentives and location decisions.",
      audit:"Verify production and studio financial information.",
      forensic:"Investigate misuse of production funds or royalty disputes.",
      ai:"Analyze production and payment data for inconsistencies."
    },
    "Healthcare": {
      bookkeeping:"Track patient revenue, payroll, supplies, and operating costs.",
      tax:"Support nonprofit, business, and employee tax decisions.",
      audit:"Verify healthcare organization financial statements.",
      forensic:"Investigate billing fraud or misuse of organization funds.",
      ai:"Analyze claims and payment data for unusual patterns."
    },
    "Food & Restaurants": {
      bookkeeping:"Track sales, inventory, payroll, and supplier payments.",
      tax:"Help evaluate expansion and tax incentives.",
      audit:"Verify sales, inventory, and expense records.",
      forensic:"Investigate cash skimming or vendor schemes.",
      ai:"Classify transactions and flag abnormal spending."
    },
    "Government": {
      bookkeeping:"Track public funds and expenditures.",
      tax:"Support tax administration and policy implementation.",
      audit:"Evaluate whether public funds are reported and used appropriately.",
      forensic:"Investigate fraud, waste, or misuse of government funds.",
      ai:"Analyze large public datasets and flag anomalies."
    }
  };

  function loadState(){
    try{
      const raw = localStorage.getItem('accountingExplorerState');
      return raw ? {...defaultState, ...JSON.parse(raw)} : structuredClone(defaultState);
    }catch(e){
      return structuredClone(defaultState);
    }
  }
  function save(){
    try{ localStorage.setItem('accountingExplorerState', JSON.stringify(state)); }catch(e){}
    updateMiniProgress();
  }
  function reset(){
    if(confirm('Restart the entire experience? This will erase your progress, badges, and survey responses.')){
      state = structuredClone(defaultState);
      try{ localStorage.removeItem('accountingExplorerState'); }catch(e){}
      go('home');
    }
  }
  function completedCount(){
    return experiences.filter(k => state.completed[k]).length;
  }
  function updateMiniProgress(){
    const count = completedCount();
    const label = document.getElementById('miniProgressLabel');
    const bar = document.getElementById('miniProgressBar');
    if(label) label.textContent = `${count} of 5 completed`;
    if(bar) bar.style.width = `${count/5*100}%`;
  }

  function render(html){
    document.getElementById('app').innerHTML = html;
    window.scrollTo({top:0, behavior:'smooth'});
    updateMiniProgress();
  }

  function go(view){
    currentView = view;
    const map = {
      home: homeView,
      survey: surveyView,
      overview: overviewView,
      hub: hubView,
      bookkeeping: () => simulationView('bookkeeping'),
      tax: () => simulationView('tax'),
      audit: () => simulationView('audit'),
      forensic: () => simulationView('forensic'),
      compare: compareView,
      ai: aiView,
      industries: industriesView,
      reflection: reflectionView,
      results: resultsView,
      teachers: teachersView
    };
    (map[view] || homeView)();
  }

  function homeView(){
    render(`
      <section class="hero">
        <span class="eyebrow">Explore Accounting</span>
        <h1>Think accounting is just taxes and spreadsheets?</h1>
        <p>Record transactions. Advise a business. Audit financial information. Investigate fraud. Then see how AI is changing the work.</p>
        <div class="cta-row">
          <button class="btn btn-primary" onclick="app.go('survey')">Start Exploring</button>
          <button class="btn btn-secondary" onclick="app.go('hub')">View Simulations</button>
        </div>
        <div class="tagline">Record. Advise. Verify. Investigate. Adapt.</div>
      </section>
      <section class="section">
        <h2>Try four different sides of accounting</h2>
        <div class="grid grid-4">
          ${simPreview('Bookkeeping','Record','Keep a business organized and figure out what happened.','5 min','bookkeeping')}
          ${simPreview('Tax','Advise','Help a growing company make a smarter business decision.','7 min','tax')}
          ${simPreview('Audit','Verify','Investigate whether a company’s numbers can be trusted.','9 min','audit')}
          ${simPreview('Forensic Accounting','Investigate','Follow financial clues when money starts disappearing.','10 min','forensic')}
        </div>
      </section>
      <section class="section card">
        <span class="eyebrow">Dedicated AI Experience</span>
        <h2>And what happens when AI enters the picture?</h2>
        <p>See what technology can automate—and where accountants still need judgment, context, communication, and professional skepticism.</p>
        <button class="btn btn-soft" onclick="app.go('ai')">Explore AI & Accounting</button>
      </section>
    `);
  }

  function simPreview(title,verb,desc,duration,route){
    const status = state.completed[route] ? 'Completed' : 'Not Started';
    return `<article class="card sim-card" onclick="app.go('${route}')">
      <div class="verb">${verb}</div><h3>${title}</h3><p>${desc}</p>
      <span class="pill">${duration}</span><div class="status">${status}</div>
    </article>`;
  }

  function surveyView(){
    const questions = [
      {key:'associations', multi:true, prompt:'When you hear “accounting,” what comes to mind?', subtitle:'Select everything that applies.', options:['Taxes','Bookkeeping','Math','Spreadsheets','Business','Financial decisions','Fraud investigations','Technology','Auditing','I’m not sure']},
      {key:'interest', scale:true, prompt:'How interested are you in learning about accounting right now?'},
      {key:'definition', prompt:'Which description sounds most like accounting to you?', options:['Recording financial transactions','Helping businesses make decisions','Checking whether financial information is reliable','Investigating suspicious financial activity','All of the above','I’m not sure']},
      {key:'math', prompt:'Do you think accountants need to be especially good at advanced math?', options:['Yes','No','I’m not sure']},
      {key:'aiBelief', prompt:'Do you think AI will reduce the need for accountants?', options:['Yes','No','I’m not sure']},
      {key:'preferredActivity', prompt:'Which type of activity sounds most interesting?', options:['Organizing financial information','Helping a business make a decision','Finding something that doesn’t make sense','Investigating suspicious activity','Working with technology','None of these']}
    ];
    let idx = 0;
    const shell = () => {
      const q = questions[idx];
      const val = state.preSurvey[q.key];
      let options = '';
      if(q.scale){
        options = `<div class="scale">${[1,2,3,4,5].map(n => `<button class="option ${val===n?'selected':''}" onclick="app.setPre('${q.key}',${n}); app.refreshSurvey(${idx})">${n}<br><span class="small">${n===1?'Not interested':n===5?'Very interested':''}</span></button>`).join('')}</div>`;
      } else {
        options = `<div class="option-list">${q.options.map(o => {
          const selected = q.multi ? (Array.isArray(val)&&val.includes(o)) : val===o;
          return `<button class="option ${selected?'selected':''}" onclick="app.chooseSurvey('${q.key}',${JSON.stringify(o)},${q.multi},${idx})">${o}</button>`;
        }).join('')}</div>`;
      }
      render(`<div class="question-shell">
        <div class="question-number">Question ${idx+1} of ${questions.length}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${(idx+1)/questions.length*100}%"></div></div>
        <h2>${q.prompt}</h2>${q.subtitle?`<p class="muted">${q.subtitle}</p>`:''}
        ${options}
        <div class="sticky-actions">
          ${idx>0?`<button class="btn btn-secondary" onclick="app.prevSurvey(${idx})">Back</button>`:''}
          <button class="btn btn-primary" ${val==null||((Array.isArray(val))&&val.length===0)?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="app.nextSurvey(${idx})">${idx===questions.length-1?'See What Accountants Actually Do':'Continue'}</button>
        </div>
      </div>`);
    };
    window.__surveyShell = shell;
    window.__surveyIdx = idx;
    shell();
  }

  function refreshSurvey(idx){
    window.__surveyIdx = idx;
    const ev = new Event('refreshSurveyInternal');
    document.dispatchEvent(ev);
  }
  document.addEventListener('refreshSurveyInternal', () => {});
  function chooseSurvey(key, value, multi, idx){
    if(multi){
      const arr = Array.isArray(state.preSurvey[key]) ? [...state.preSurvey[key]] : [];
      const i = arr.indexOf(value);
      if(i>=0) arr.splice(i,1); else arr.push(value);
      state.preSurvey[key]=arr;
    } else state.preSurvey[key]=value;
    save(); surveyQuestion(idx);
  }
  function setPre(key,val){ state.preSurvey[key]=val; save(); }
  function surveyQuestion(idx){
    const questions = [
      {key:'associations', multi:true, prompt:'When you hear “accounting,” what comes to mind?', subtitle:'Select everything that applies.', options:['Taxes','Bookkeeping','Math','Spreadsheets','Business','Financial decisions','Fraud investigations','Technology','Auditing','I’m not sure']},
      {key:'interest', scale:true, prompt:'How interested are you in learning about accounting right now?'},
      {key:'definition', prompt:'Which description sounds most like accounting to you?', options:['Recording financial transactions','Helping businesses make decisions','Checking whether financial information is reliable','Investigating suspicious financial activity','All of the above','I’m not sure']},
      {key:'math', prompt:'Do you think accountants need to be especially good at advanced math?', options:['Yes','No','I’m not sure']},
      {key:'aiBelief', prompt:'Do you think AI will reduce the need for accountants?', options:['Yes','No','I’m not sure']},
      {key:'preferredActivity', prompt:'Which type of activity sounds most interesting?', options:['Organizing financial information','Helping a business make a decision','Finding something that doesn’t make sense','Investigating suspicious activity','Working with technology','None of these']}
    ];
    const q=questions[idx], val=state.preSurvey[q.key];
    let options='';
    if(q.scale){
      options=`<div class="scale">${[1,2,3,4,5].map(n=>`<button class="option ${val===n?'selected':''}" onclick="app.setPre('${q.key}',${n}); app.surveyQuestion(${idx})">${n}<br><span class="small">${n===1?'Not interested':n===5?'Very interested':''}</span></button>`).join('')}</div>`;
    } else {
      options=`<div class="option-list">${q.options.map(o=>{
        const selected=q.multi?(Array.isArray(val)&&val.includes(o)):val===o;
        return `<button class="option ${selected?'selected':''}" onclick='app.chooseSurvey(${JSON.stringify(q.key)},${JSON.stringify(o)},${!!q.multi},${idx})'>${o}</button>`;
      }).join('')}</div>`;
    }
    render(`<div class="question-shell">
      <div class="question-number">Question ${idx+1} of ${questions.length}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${(idx+1)/questions.length*100}%"></div></div>
      <h2>${q.prompt}</h2>${q.subtitle?`<p class="muted">${q.subtitle}</p>`:''}
      ${options}
      <div class="sticky-actions">
        ${idx>0?`<button class="btn btn-secondary" onclick="app.surveyQuestion(${idx-1})">Back</button>`:''}
        <button class="btn btn-primary" ${val==null||((Array.isArray(val))&&val.length===0)?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="app.nextSurvey(${idx})">${idx===questions.length-1?'See What Accountants Actually Do':'Continue'}</button>
      </div>
    </div>`);
  }
  function prevSurvey(idx){ surveyQuestion(idx-1); }
  function nextSurvey(idx){
    if(idx<5) surveyQuestion(idx+1);
    else go('overview');
  }

  function overviewView(){
    render(`
      <span class="eyebrow">The Big Picture</span>
      <h1 class="page-title">Accounting is more than one job.</h1>
      <p class="lede">Different accountants solve different kinds of problems. Here are five ways to think about the profession.</p>
      <div class="grid grid-3 section">
        ${concept('Record','Bookkeeping','What happened?','Keep financial information organized and accurate.')}
        ${concept('Advise','Tax','What should we do?','Help businesses understand the financial and tax consequences of decisions.')}
        ${concept('Verify','Audit','Can we trust this?','Gather evidence and evaluate whether financial information is reliable.')}
        ${concept('Investigate','Forensic Accounting','What happened here?','Follow financial evidence when something appears suspicious.')}
        ${concept('Adapt','AI + Technology','How is the work changing?','Use technology to analyze more information while applying human judgment.')}
      </div>
      <div class="cta-row"><button class="btn btn-primary" onclick="app.go('hub')">Try the Work Yourself</button></div>
    `);
  }
  function concept(verb,career,q,desc){
    return `<div class="card concept-card"><div class="big-verb">${verb}</div><h3>${career}</h3><p><strong>${q}</strong></p><p>${desc}</p></div>`;
  }

  function hubView(){
    render(`
      <span class="eyebrow">Simulation Hub</span>
      <h1 class="page-title">Try the work yourself.</h1>
      <p class="lede">You can complete the simulations in any order. For the full story, start with Bookkeeping and work through Forensic Accounting.</p>
      <div class="grid grid-2 section">
        ${simPreview('Bookkeeping','Record','Organize a growing company’s transactions and find a classification error.','5 min','bookkeeping')}
        ${simPreview('Tax','Advise','Compare expansion options and decide which facts actually matter.','7 min','tax')}
        ${simPreview('Audit','Verify','Investigate an unusual inventory trend and evaluate evidence.','9 min','audit')}
        ${simPreview('Forensic Accounting','Investigate','Follow suspicious payments and build an evidence-based case.','10 min','forensic')}
      </div>
      <section class="section card">
        <h2>AI is a fifth experience</h2>
        <p>After the simulations, explore what AI can automate and where accountants still need judgment, context, communication, and professional skepticism.</p>
        <button class="btn btn-soft" onclick="app.go('ai')">Open AI & Accounting</button>
      </section>
    `);
  }

  const sims = {
    bookkeeping: {
      title:'Bookkeeping: Keep the Business Organized',
      badge:'Record Keeper',
      intro:'Campus Threads is a growing clothing company. Before anyone can analyze the business, someone has to make sure its records accurately reflect what happened.',
      steps:[
        {type:'choice', title:'Monthly rent', body:'Campus Threads pays $1,500 for monthly store rent. What happened?', options:[
          ['Cash decreased and an expense occurred',true,'Correct. Paying rent reduces cash and creates an expense.'],
          ['Cash increased',false,'Rent is a payment, so cash does not increase.'],
          ['Revenue increased',false,'Paying rent is not revenue.'],

  }
  function aiArea(name,ai,human){
    return `<div class="card"><h3>${name}</h3><p><strong>AI may help:</strong></p><ul>${ai.map(x=>`<li>${x}</li>`).join('')}</ul><p><strong>Accountants still:</strong></p><ul>${human.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  }
  function aiReflection(){
    const val=state.postSurvey.aiBelief;
    const opts=['AI will likely eliminate most accounting work','AI will automate some tasks and change accounting jobs','AI probably will not affect accounting much','I am still unsure'];
    render(`<div class="sim-shell"><span class="eyebrow">Reflection</span><h1 class="page-title">How do you see AI now?</h1>
      <p class="lede">Which statement best matches your view after the examples you just saw?</p>
      <div class="option-list">${opts.map(o=>`<button class="option ${val===o?'selected':''}" onclick='app.setPostAI(${JSON.stringify(o)})'>${o}</button>`).join('')}</div>
      <div class="sticky-actions"><button class="btn btn-primary" ${!val?'disabled style="opacity:.45"':''} onclick="app.completeAI()">See Where Accountants Work</button></div>
    </div>`);
  }
  function setPostAI(v){state.postSurvey.aiBelief=v;save();aiView();}
  function completeAI(){
    state.completed.ai=true;
    if(!state.badges.includes('Future Accountant')) state.badges.push('Future Accountant');
    save(); go('industries');
  }

  function industriesView(){
    const selected=state.selectedIndustry;
    render(`<span class="eyebrow">Across Industries</span><h1 class="page-title">Accounting exists inside the industries you already care about.</h1>
      <p class="lede">Pick an industry to see how bookkeeping, tax, audit, forensic accounting, and AI can show up inside it.</p>
      <div class="grid grid-3 section">
        ${Object.keys(industries).map(name=>`<button class="card industry-card" onclick='app.selectIndustry(${JSON.stringify(name)})'><h3>${name}</h3><p>Explore accounting inside ${name.toLowerCase()}.</p></button>`).join('')}
      </div>
      ${selected ? industryDetail(selected) : ''}
      <div class="cta-row section"><button class="btn btn-primary" onclick="app.go('reflection')">Find What Interested You Most</button></div>`);
  }
  function selectIndustry(name){state.selectedIndustry=name;save();industriesView();}
  function industryDetail(name){
    const x=industries[name];
    return `<div class="industry-detail card"><h2>${name}</h2>
      <div class="grid grid-2">
        <div><h3>Bookkeeping</h3><p>${x.bookkeeping}</p></div>
        <div><h3>Tax</h3><p>${x.tax}</p></div>
        <div><h3>Audit</h3><p>${x.audit}</p></div>
        <div><h3>Forensic</h3><p>${x.forensic}</p></div>
        <div><h3>AI + Technology</h3><p>${x.ai}</p></div>
      </div>
      <div class="inline-note top-gap"><strong>You do not always have to choose between accounting and an industry you care about.</strong> Accounting can be how you work inside that industry.</div>
    </div>`;
  }

  function reflectionView(){
    const opts=['Organizing financial information','Advising businesses','Evaluating evidence','Investigating suspicious activity','Working with technology'];
    render(`<div class="question-shell"><span class="eyebrow">Career Reflection</span><h1 class="page-title">What type of work interested you most?</h1>
      <p class="lede">Choose up to two. This is not an aptitude test—it is just a way to point you toward areas you may want to explore.</p>
      <div class="option-list">${opts.map(o=>`<button class="option ${state.favoriteAreas.includes(o)?'selected':''}" onclick='app.toggleFavorite(${JSON.stringify(o)})'>${o}</button>`).join('')}</div>
      ${state.favoriteAreas.length?careerSuggestions():''}
      <div class="sticky-actions"><button class="btn btn-primary" ${state.favoriteAreas.length===0?'disabled style="opacity:.45"':''} onclick="app.postSurveyView(0)">Continue to Final Reflection</button></div>
    </div>`);
  }
  function toggleFavorite(o){
    const a=[...state.favoriteAreas], i=a.indexOf(o);
    if(i>=0)a.splice(i,1); else if(a.length<2)a.push(o); else { alert('Choose up to two.'); return; }
    state.favoriteAreas=a; save(); reflectionView();
  }
  function careerSuggestions(){
    const map={
      'Organizing financial information':['Corporate accounting','Accounting operations','Controller pathway','Financial reporting'],
      'Advising businesses':['Tax','Business advisory','Transaction-related accounting'],
      'Evaluating evidence':['External audit','Internal audit','Assurance'],
      'Investigating suspicious activity':['Forensic accounting','Fraud examination','Government investigations'],
      'Working with technology':['Accounting analytics','Technology-enabled audit','Accounting systems','Data-oriented accounting roles']
    };
    const set=[...new Set(state.favoriteAreas.flatMap(x=>map[x]))];
    return `<div class="card top-gap"><h3>You may want to explore:</h3><div class="cta-row">${set.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div>`;
  }

  const postQuestions=[
    {key:'definition',prompt:'What do accountants do?',options:['Record transactions','Advise businesses','Verify financial information','Investigate fraud','Use technology','All of the above']},
    {key:'interest',prompt:'How interested are you in learning more about accounting now?',scale:true},
    {key:'change',prompt:'Did your perception of accounting change?',options:['A lot','Somewhat','Slightly','Not really','Not at all']},
    {key:'explore',prompt:'Which area would you most like to explore further?',options:['Bookkeeping / Corporate Accounting','Tax','Audit','Forensic Accounting','Accounting + Technology','None']},
    {key:'shift',prompt:'Which part of the experience changed your perception the most?',options:['Bookkeeping','Tax','Audit','Forensic Accounting','AI and Accounting','Industry Exploration','Nothing changed my perception']}
  ];
  function postSurveyView(idx){
    if(idx>=postQuestions.length){save();return resultsView();}
    const q=postQuestions[idx], val=state.postSurvey[q.key];
    let options='';
    if(q.scale){
      options=`<div class="scale">${[1,2,3,4,5].map(n=>`<button class="option ${val===n?'selected':''}" onclick="app.setPost('${q.key}',${n}); app.postSurveyView(${idx})">${n}<br><span class="small">${n===1?'Not interested':n===5?'Very interested':''}</span></button>`).join('')}</div>`;
    } else options=`<div class="option-list">${q.options.map(o=>`<button class="option ${val===o?'selected':''}" onclick='app.setPost(${JSON.stringify(q.key)},${JSON.stringify(o)}); app.postSurveyView(${idx})'>${o}</button>`).join('')}</div>`;
    render(`<div class="question-shell"><div class="question-number">Final reflection ${idx+1} of ${postQuestions.length}</div><div class="progress-track"><div class="progress-fill" style="width:${(idx+1)/postQuestions.length*100}%"></div></div><h2>${q.prompt}</h2>${options}<div class="sticky-actions">${idx>0?`<button class="btn btn-secondary" onclick="app.postSurveyView(${idx-1})">Back</button>`:''}<button class="btn btn-primary" ${val==null?'disabled style="opacity:.45"':''} onclick="app.postSurveyView(${idx+1})">${idx===postQuestions.length-1?'See My Results':'Continue'}</button></div></div>`);
  }
  function setPost(k,v){state.postSurvey[k]=v;save();}
  function resultsView(){
    const before=state.preSurvey.interest||0, after=state.postSurvey.interest||0, delta=after-before;
    const suggestions=state.favoriteAreas.length?careerSuggestions():'';
    render(`<span class="eyebrow">Your Results</span><h1 class="page-title">Your Accounting Experience</h1>
      <div class="grid grid-2 section">
        <div class="card"><h2>Before</h2><p>You associated accounting with:</p><div class="cta-row">${(state.preSurvey.associations||[]).map(x=>`<span class="pill">${x}</span>`).join('')||'<span class="muted">No response</span>'}</div></div>
        <div class="card"><h2>After</h2><p>You explored:</p><div class="cta-row"><span class="pill">Recording</span><span class="pill">Advising</span><span class="pill">Auditing</span><span class="pill">Investigation</span><span class="pill">AI + Technology</span></div></div>
      </div>
      <div class="grid grid-2 section">
        <div class="card center"><h3>Interest change</h3><div class="result-delta">${delta>0?'+':''}${delta}</div><p>${before} / 5 before → ${after} / 5 after</p></div>
        <div class="card"><h3>Perception change</h3><p>${state.postSurvey.change||'Not answered'}</p><h3>Area to explore</h3><p>${state.postSurvey.explore||'Not answered'}</p></div>
      </div>
      ${suggestions}
      <div class="section result-box"><h2>Accounting may be broader than you initially thought.</h2><p>The goal of this experience is not to tell you what to major in. It is to give you enough context to decide whether accounting is worth exploring further.</p></div>
      <div class="cta-row"><button class="btn btn-primary" onclick="app.go('hub')">Explore Again</button><button class="btn btn-secondary" onclick="app.reset()">Restart Experience</button></div>`);
  }

  function teachersView(){
    render(`<span class="eyebrow">For Teachers</span><h1 class="page-title">A classroom introduction to accounting careers—no accounting expertise required.</h1>
      <div class="grid grid-3 section">
        <div class="card teacher-plan"><h3>15-Minute Version</h3><ul><li>Pre-survey</li><li>One simulation</li><li>Short discussion</li></ul></div>
        <div class="card teacher-plan"><h3>30-Minute Version</h3><ul><li>Pre-survey</li><li>Bookkeeping</li><li>Audit or Forensic</li><li>AI mini-activity</li><li>Reflection</li></ul></div>
        <div class="card teacher-plan"><h3>50-Minute Version</h3><ul><li>Pre-survey</li><li>All four simulations</li><li>AI section</li><li>Post-survey</li></ul></div>
      </div>
      <section class="section"><h2>Learning Objectives</h2><div class="grid grid-2">
        <div class="card"><h3>Bookkeeping</h3><p>Students understand that accounting begins with accurate financial information.</p></div>
        <div class="card"><h3>Tax</h3><p>Students understand that tax can involve planning and business decisions.</p></div>
        <div class="card"><h3>Audit</h3><p>Students understand that auditors gather evidence and apply professional skepticism.</p></div>
        <div class="card"><h3>Forensic Accounting</h3><p>Students understand that accounting can be used to investigate suspicious financial activity.</p></div>
        <div class="card"><h3>AI</h3><p>Students understand that technology can automate some tasks while judgment remains important.</p></div>
      </div></section>
      <section class="section card"><h2>Discussion Questions</h2><ul>
        <li>Which simulation was most different from your original view of accounting?</li>
        <li>Which role required the most judgment?</li>
        <li>Which role involved the most investigation?</li>
        <li>Where could AI help?</li>
        <li>Where would you still want human review?</li>
        <li>Which accounting career surprised you most?</li>
      </ul></section>
      <section class="section card"><h2>Teaching Accounting in the Age of AI</h2><p>Use the AI module to discuss task automation versus professional judgment. Avoid presenting AI as either irrelevant or certain to replace entire professions. Focus students on what technology can do well, where context matters, and who remains responsible for conclusions.</p></section>
      <section class="section"><h2>Quick Glossary</h2><div class="grid grid-2">
        ${glossary('Asset','Something a business owns or controls that has value.')}
        ${glossary('Liability','Something a business owes.')}
        ${glossary('Revenue','Money earned from selling goods or services.')}
        ${glossary('Expense','A cost incurred while operating the business.')}
        ${glossary('Audit','An independent evaluation of financial information.')}
        ${glossary('Professional Skepticism','A questioning mindset that does not automatically accept explanations without evidence.')}
        ${glossary('Forensic Accounting','Using accounting and investigative techniques to examine potential fraud, misconduct, or disputes.')}
      </div></section>`);
  }
  function glossary(t,d){return `<div class="card"><h3>${t}</h3><p>${d}</p></div>`;}

  return {
    go, reset, chooseSurvey, setPre, nextSurvey, prevSurvey, surveyQuestion, refreshSurvey,
    setSimStep, answerSim, setReflection, completeSim,
    setAIStep, answerAI, nextAITask, answerAICase1, answerAICase2, setPostAI, completeAI,
    selectIndustry, toggleFavorite, postSurveyView, setPost
  };
})();

document.addEventListener('DOMContentLoaded', () => app.go('home'));
</script>
</body>
</html>
