/* FINAL PRESENTATION LAYOUT FIX
   The app root is #app.shell (not .app-shell). This override removes the normal
   webpage shell padding/margins while the classroom presentation is active. */
body.teacher-board-mode{
  margin:0!important;
  width:100vw;
  height:100dvh;
  overflow:hidden!important;
  background:#f5f6f5;
}

body.teacher-board-mode #app.shell{
  max-width:none!important;
  width:100vw!important;
  height:100dvh!important;
  min-height:0!important;
  margin:0!important;
  padding:0!important;
  overflow:hidden!important;
}

body.teacher-board-mode .board-shell{
  width:min(1180px, calc(100vw - 28px));
  height:100dvh;
  min-height:0;
  margin:0 auto;
  display:grid;
  grid-template-rows:64px minmax(0,1fr) 62px;

  min-height:0;
  height:100%;

  flex-direction:column;
  justify-content:center;
  gap:8px;
}

body.teacher-board-mode .board-stage .present-callout,

  function answerStudentSim(type,stage,index){
    const data=getStudentSimData(type);
    const set=stage===1?data.first:stage===2?data.second:data.third;
    if(!set || !set.opts[index])return;
    state.studentSimChoices=state.studentSimChoices||{};
    state.studentSimChoices[type]=state.studentSimChoices[type]||[];
    state.studentSimChoices[type][stage-1]=index;
    const [,msg,badge]=set.opts[index];
    if(!state.behaviors[type].includes(badge))state.behaviors[type].push(badge);
    save();
    document.querySelectorAll('.option').forEach(x=>x.disabled=true);
    const fb=document.getElementById('simFeedback');

    const label=stage===1?'See what happens next':stage===2?'Continue the case':'Reveal the career';
    fb.innerHTML=`<div class="feedback"><strong>How a professional might think about it</strong>${msg}</div><div class="sticky-actions"><button class="btn btn-primary" onclick="app.setSimStep('${type}',${nextStage})">${label}</button></div>`;

  function accountantDid(title,didItems,notItems,skills){
    return `<div class="accountant-did"><h3>${title}</h3><div class="accountant-did-grid"><div><strong>What you did</strong>${didItems.map(x=>`<div>• ${x}</div>`).join('')}</div><div><strong>What you did not need</strong>${notItems.map(x=>`<div>• ${x}</div>`).join('')}</div></div><div style="margin-top:12px"><strong>Skills used:</strong> ${skills.join(' · ')}</div></div>`;
  }

  function teacherBookkeepingCase(){
    const c=teacherCaseState('bookkeeping');
    if(c.stage===0)return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">60-second challenge</span><h3>Campus Threads pays $2,000 for shirts it plans to sell later.</h3><p>Start with the business situation in plain English: what changed for the company?</p></div><div class="teacher-case-body"><div class="teacher-case-question">What happened?</div>${teacherCaseButtons('bookkeeping',1,[{label:'The company has less cash, but now has shirts it can sell',value:'inventory'},{label:'The company earned $2,000',value:'revenue'},{label:'The company made $2,000 of profit',value:'profit'}])}</div></div>`;

    const choice=c.choices[0];
    const msg=choice==='inventory'
      ?'Exactly. The business traded cash for something it now owns and plans to sell later.'
      :choice==='revenue'
        ?'Buying shirts does not mean the company earned money. Revenue happens when the business sells goods or services to customers.'
        :'Buying shirts does not create profit by itself. The company has simply exchanged cash for products it plans to sell later.';
    return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Bookkeeping foundation</span><h3>Start with what happened. Name the accounting concept afterward.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>What you just figured out</h4><p>${msg}</p></div><div class="plain-language"><strong>Accounting reveal:</strong> Accountants call the shirts <span class="term" title="Products a business owns and plans to sell">inventory</span>. Inventory is one kind of <span class="term" title="Something a business owns or controls that has value">asset</span>.</div><details class="optional-accounting"><summary>Want the accounting language?</summary><div class="optional-body">Cash decreased because the company paid $2,000. Inventory increased because the company now owns shirts it plans to sell.</div></details><div class="teacher-skill-reveal"><h3>You just used the recordkeeping foundation of accounting.</h3><p>You understood the business event first. The terminology came second.</p></div>${teacherResetButton('bookkeeping')}</div></div>`;
  }

  function teacherForensicCase(){
    const c=teacherCaseState('forensic');
    const visited=c.visited||[];

    if(c.stage===0)return `<div class="teacher-case">
      <div class="teacher-case-head"><span class="kicker">Career challenge</span><h3>$14,000 is missing from a music company.</h3><p>You are the investigation team. Decide where to start.</p></div>
      <div class="teacher-case-body">
        <div class="teacher-case-question">Where would you look first?</div>
        ${teacherCaseButtons('forensic',1,[{label:'Vendor payments',value:'vendor'},{label:'Employee reimbursements',value:'reimbursements'},{label:'Customer payments',value:'revenue'}])}
        <div class="reasoning-step"><h4>Explain your reasoning</h4><p><strong>Why did you choose that?</strong> What are you hoping to learn from this path?</p></div>
      </div></div>`;

    if(c.stage===1){
      const first=c.choices[0];

      if(first==='vendor'){
        return `<div class="teacher-case">
          <div class="teacher-case-head"><span class="teacher-step">Step 2</span><h3>The vendor payments stand out.</h3></div>
          <div class="teacher-case-body">
            <div class="teacher-case-reveal"><h4>What you found</h4><p>You find five payments between $4,850 and $4,980 to the same new vendor.</p></div>
            <div class="dialogue"><span class="speaker">Employee</span><p>“That vendor has worked with us for a while. I think you’re making this into something it isn’t.”</p></div>
            <div class="teacher-case-question">What is the best next question?</div>
            ${teacherCaseButtons('forensic',2,[{label:'“Can you explain how this vendor was selected?”',value:'open'},{label:'“Did you steal the money?”',value:'accuse'},{label:'“Why should we believe you?”',value:'hostile'}])}
            <div class="reasoning-step"><h4>Defend your choice</h4><p>What would this question help you learn? What risk comes from accusing someone too early?</p></div>
            ${teacherResetButton('forensic')}
          </div></div>`;
      }

      if(first==='reimbursements'){
        const nextOpts=[{label:'Review vendor payments',value:'vendor'}];
        if(!visited.includes('revenue')) nextOpts.push({label:'Check customer payments',value:'revenue'});
        return `<div class="teacher-case">
          <div class="teacher-case-head"><span class="teacher-step">Step 2</span><h3>The reimbursements do not explain the missing money.</h3></div>
          <div class="teacher-case-body">
            <div class="teacher-case-reveal"><h4>What you found</h4><p>The reimbursements have receipts, travel dates, and supervisor approvals. Nothing obvious links them to the missing $14,000.</p></div>
            <div class="reasoning-step"><h4>What does that tell you?</h4><p>You have not proven every reimbursement is perfect. You have learned that this path does not currently explain the problem, so the investigation should move to a different source.</p></div>
            <div class="teacher-case-question">${visited.includes('revenue')?'You have already ruled out customer payments. What should you check now?':'Where should the investigation go next?'}</div>
            ${teacherCaseButtons('forensic',1,nextOpts)}
            <div class="reasoning-step"><h4>Keep following the evidence</h4><p>Investigations become stronger when you rule out explanations deliberately instead of jumping straight to the most suspicious-looking answer.</p></div>
            ${teacherResetButton('forensic')}
          </div></div>`;
      }

      const nextOpts=[{label:'Review vendor payments',value:'vendor'}];
      if(!visited.includes('reimbursements')) nextOpts.push({label:'Check employee reimbursements',value:'reimbursements'});
      return `<div class="teacher-case">
        <div class="teacher-case-head"><span class="teacher-step">Step 2</span><h3>The customer payments do not explain the missing money.</h3></div>
        <div class="teacher-case-body">
          <div class="teacher-case-reveal"><h4>What you found</h4><p>Customer invoices match the money deposited into the company’s bank account. The missing $14,000 does not appear to come from recorded customer payments.</p></div>
          <div class="reasoning-step"><h4>What does that tell you?</h4><p>You have narrowed the investigation by ruling out one likely source of the problem.</p></div>
          <div class="teacher-case-question">${visited.includes('reimbursements')?'You have already checked reimbursements too. Which remaining path deserves attention?':'Where should you look next?'}</div>
          ${teacherCaseButtons('forensic',1,nextOpts)}
          <div class="reasoning-step"><h4>Narrow the field</h4><p>A good investigation eliminates explanations one at a time and lets the evidence determine where attention goes next.</p></div>
          ${teacherResetButton('forensic')}
        </div></div>`;
    }

    if(c.stage===2){
      const second=c.choices[1];
      const reveal=second==='open'
        ?'The employee explains that they recommended the vendor. The vendor record uses the same phone number as the employee’s emergency contact.'
        :second==='accuse'
          ?'The employee denies stealing anything and becomes defensive. The accusation produces little useful information, so the team still needs objective evidence.'
          :'The employee becomes defensive and gives very little useful information. The team still needs facts rather than a confrontation.';
      return `<div class="teacher-case">
        <div class="teacher-case-head"><span class="teacher-step">Step 3</span><h3>Now the pattern is stronger—but it is still not a final conclusion.</h3></div>
        <div class="teacher-case-body">
          <div class="teacher-case-reveal"><h4>What happened</h4><p>${reveal}</p></div>
          <div class="teacher-case-question">What conclusion is strongest right now?</div>
          ${teacherCaseButtons('forensic',3,[{label:'Fraud is proven',value:'proven'},{label:'There is enough concern to investigate the relationship further',value:'investigate'},{label:'Nothing unusual happened',value:'nothing'}])}
          <div class="reasoning-step"><h4>Why?</h4><p>What evidence supports your choice—and what do you still need to establish?</p></div>
          ${teacherResetButton('forensic')}
        </div></div>`;
    }

    const final=c.choices[2];
    const msg=final==='investigate'
      ?'That is the strongest professional response. The evidence supports continued investigation, but intent and responsibility still need to be established.'
      :final==='proven'
        ?'The evidence is concerning, but it does not yet prove intent or responsibility. A forensic accountant would continue gathering evidence before calling the matter fraud.'
        :'The evidence is too significant to dismiss. The strongest response is to investigate the relationship further without treating suspicion as proof.';
    return `<div class="teacher-case">
      <div class="teacher-case-head"><span class="kicker">Career reveal</span><h3>You just worked like a forensic accountant.</h3></div>
      <div class="teacher-case-body">
        <div class="teacher-case-reveal"><h4>Reasoning check</h4><p>${msg}</p></div>
        ${accountantDid('What did the accountant actually do?',['ruled out explanations that did not fit','followed the strongest remaining evidence','asked questions without assuming guilt','connected financial and nonfinancial evidence','separated suspicion from a final conclusion'],['debits and credits','advanced math','a journal entry'],['Investigation','Communication','Judgment','Pattern recognition'])}
        ${teacherResetButton('forensic')}
      </div></div>`;
  }

  function teacherAuditCase(){
    const c=teacherCaseState('audit');
    if(c.stage===0)return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Career challenge</span><h3>Campus Threads says it has $520,000 of products.</h3><p>Employees counted only $438,000 in the main warehouse.</p></div><div class="teacher-case-body"><div class="dialogue"><span class="speaker">Warehouse manager</span><p>“That’s normal. Some products are stored offsite. We really don’t need to spend more time on this.”</p></div><div class="teacher-case-question">How should the auditor respond?</div>${teacherCaseButtons('audit',1,[{label:'“Okay, that explanation makes sense.”',value:'accept'},{label:'“Can you show us records from the offsite warehouse?”',value:'evidence'},{label:'“Then the $520,000 number must be wrong.”',value:'wrong'}])}<div class="reasoning-step"><h4>Before the reveal</h4><p>What is the difference between an explanation and evidence?</p></div></div></div>`;
    if(c.stage===1){const choice=c.choices[0];const lead=choice==='evidence'?'You asked for support before reaching a conclusion.':choice==='accept'?'The explanation might be true, but an auditor still needs evidence.':'The count creates a question, but the auditor should gather evidence before changing the number.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="teacher-step">Step 2</span><h3>The offsite warehouse responds.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>Your first decision</h4><p>${lead}</p></div><div class="teacher-case-evidence"><div><strong>Offsite confirmation</strong>$76,000 of products</div><div><strong>Total supported</strong>$514,000</div><div><strong>Difference remaining</strong>$6,000</div></div><div class="dialogue"><span class="speaker">Manager</span><p>“It’s only $6,000. Can we move on now?”</p></div><div class="teacher-case-question">What should the auditor say?</div>${teacherCaseButtons('audit',2,[{label:'“First, we need to understand what the $6,000 difference is.”',value:'difference'},{label:'“Yes, most of the number is supported.”',value:'moveon'},{label:'“No. This proves management is hiding something.”',value:'accuse'}])}<div class="reasoning-step"><h4>Defend the reasoning</h4><p>What would you need to know before deciding whether the remaining difference matters?</p></div>${teacherResetButton('audit')}</div></div>`;}
    const final=c.choices[1];const msg=final==='difference'?'Exactly. The auditor keeps asking questions until the remaining difference is understood and the evidence is sufficient.':'The key is not automatically accepting or accusing. The auditor has to understand the remaining difference and decide whether more work is needed.';return `<div class="teacher-case"><div class="teacher-case-head"><span class="kicker">Career reveal</span><h3>You just worked like an auditor.</h3></div><div class="teacher-case-body"><div class="teacher-case-reveal"><h4>Reasoning check</h4><p>${msg}</p></div>${accountantDid('What did the accountant actually do?',['questioned an explanation','asked for outside evidence','followed up on a remaining difference','explained why more support was needed'],['advanced equations','memorizing standards','a debit or credit'],['Communication','Evidence evaluation','Judgment','Questioning mindset'])}${teacherResetButton('audit')}</div></div>`;
  }

  function teacherAdvisoryCase(){
    const c=teacherCaseState('advisory');

    if(c.stage===0)return `<div class="teacher-case">
      <div class="teacher-case-head"><span class="kicker">Career challenge</span><h3>A gaming startup needs a new office.</h3><p>The owners ask the accounting team which location makes more business sense.</p></div>
      <div class="teacher-case-body">
        <table class="comparison-table"><tr><th></th><th>Location A</th><th>Location B</th></tr><tr><td>Annual rent</td><td>$80,000</td><td>$110,000</td></tr><tr><td>Annual payroll</td><td>$450,000</td><td>$430,000</td></tr><tr><td>Tax incentive</td><td>$0</td><td>$75,000</td></tr><tr><td>Talent pool</td><td>Smaller</td><td>Larger</td></tr></table>
        <div class="teacher-case-question" style="margin-top:18px">What would you recommend right now?</div>
        ${teacherCaseButtons('advisory',1,[{label:'Location A',value:'A'},{label:'Location B',value:'B'},{label:'We need more information before recommending either',value:'more'}])}
        <div class="reasoning-step"><h4>Why?</h4><p>Which fact is driving your recommendation—and what might still be missing?</p></div>
      </div></div>`;

    if(c.stage===1){
      const first=c.choices[0];
      const response=first==='A'
        ?'Location A is cheaper on rent, so the choice is understandable. But the lower rent alone does not tell you whether it is the better long-term business decision.'
        :first==='B'
          ?'Location B has a larger talent pool and a tax incentive, so the choice is understandable. But you still need to know how durable those advantages are.'
          :'Good instinct. The first table gives you useful clues, but not enough context to defend a recommendation.';
      const founder=first==='A'
        ?'“Location A is cheaper, but I need to hire software engineers quickly. Are we focusing too much on rent?”'
        :first==='B'
          ?'“Location B has the incentive, but it only lasts for a while. Are we putting too much weight on the tax break?”'
          :'“What additional information would you need before you could actually recommend one location?”';

      return `<div class="teacher-case">
        <div class="teacher-case-head"><span class="teacher-step">Step 2</span><h3>The client adds the missing context.</h3></div>
        <div class="teacher-case-body">
          <div class="teacher-case-reveal"><h4>Your first decision</h4><p>${response}</p></div>
          <div class="dialogue"><span class="speaker">Founder</span><p>${founder}</p></div>
          <div class="teacher-case-evidence"><div><strong>Incentive term</strong>Location B’s $75,000 incentive lasts one year</div><div><strong>Hiring need</strong>20 developers planned</div><div><strong>Growth plan</strong>At least five years in the new office</div></div>
          <div class="teacher-case-question">How should the accounting team respond?</div>
          ${teacherCaseButtons('advisory',2,[{label:'“We should compare the five-year cost and the hiring impact before recommending.”',value:'longterm'},{label:'“The tax incentive makes Location B the answer.”',value:'taxonly'},{label:'“Cheaper rent means Location A is the answer.”',value:'rentonly'}])}
          <div class="reasoning-step"><h4>Explain it like an adviser</h4><p>In one sentence, explain to the founder what you would consider before making the recommendation.</p></div>
          ${teacherResetButton('advisory')}
        </div></div>`;
    }

    const final=c.choices[1];
    const msg=final==='longterm'
      ?'Exactly. A useful recommendation connects the financial effects with the company’s hiring and growth needs over the period that actually matters.'
      :final==='taxonly'
        ?'The incentive matters, but it lasts only one year. An adviser would compare that benefit with the five-year costs, hiring needs, and operating consequences before recommending Location B.'
        :'Lower rent matters, but it is only one part of the decision. An adviser would compare the longer-term costs with hiring needs, incentives, and operations before recommending Location A.';
    return `<div class="teacher-case">
      <div class="teacher-case-head"><span class="kicker">Career reveal</span><h3>You just worked like a tax or business adviser.</h3></div>
      <div class="teacher-case-body">
        <div class="teacher-case-reveal"><h4>Reasoning check</h4><p>${msg}</p></div>
        ${accountantDid('What did the accountant actually do?',['compared alternatives','identified missing facts','adjusted the analysis when the client added context','considered a longer time horizon','explained how to build a defensible recommendation'],['filling out a tax return','advanced math','memorizing tax forms'],['Business judgment','Communication','Analysis','Decision-making'])}
        ${teacherResetButton('advisory')}
      </div></div>`;
  }

  function teacherAICase(){
    const c=teacherCaseState('teacher_ai');

    if(c.stage===0)return `<div class="teacher-case">
      <div class="teacher-case-head"><span class="kicker">AI career challenge</span><h3>AI flags a $12,000 software payment as unusual.</h3><p>It is much larger than the company’s usual software payments.</p></div>
      <div class="teacher-case-body">
        <div class="teacher-case-question">What should happen next?</div>
        ${teacherCaseButtons('teacher_ai',1,[{label:'Treat the flag as proof that something is wrong',value:'fraud'},{label:'Gather evidence and understand the transaction',value:'investigate'},{label:'Ignore the flag because AI can be wrong',value:'ignore'}])}
        <div class="reasoning-step"><h4>Why?</h4><p>What has AI actually told you—and what has it not told you?</p></div>
      </div></div>`;

    if(c.stage===1){
      const first=c.choices[0];
      const msg=first==='investigate'
        ?'You treated the AI output as a lead rather than a conclusion.'
        :first==='fraud'
          ?'The flag tells you the payment is unusual, not that it is fraudulent. The next step is to gather context before deciding what the flag means.'
          :'AI can be wrong, but ignoring a flag would waste potentially useful information. The better move is to investigate the item and test whether the concern is supported.';
      return `<div class="teacher-case">
        <div class="teacher-case-head"><span class="teacher-step">Step 2</span><h3>Review the context.</h3></div>
        <div class="teacher-case-body">
          <div class="teacher-case-reveal"><h4>First decision</h4><p>${msg}</p></div>
          <div class="teacher-case-evidence"><div><strong>Contract</strong>12-month enterprise software license</div><div><strong>Invoice</strong>$12,000, matching the contract</div><div><strong>Approval</strong>IT director and CFO</div></div>
          <div class="teacher-case-evidence"><div><strong>Prior year</strong>$11,500 annual payment</div><div><strong>Vendor</strong>Known software provider</div><div><strong>Timing</strong>Annual renewal date</div></div>
          <div class="teacher-case-question">What does the evidence support?</div>
          ${teacherCaseButtons('teacher_ai',2,[{label:'Likely a legitimate annual payment',value:'legit'},{label:'Proven fraud',value:'fraud'},{label:'The AI failed',value:'failure'}])}
          <div class="reasoning-step"><h4>Explain your conclusion</h4><p>Which pieces of evidence matter most?</p></div>
          ${teacherResetButton('teacher_ai')}
        </div></div>`;
    }

    if(c.stage===2){
      const conclusion=c.choices[1];
      const msg=conclusion==='legit'
        ?'The transaction looked unusual compared with monthly activity, but the contract, approval, prior-year payment, and renewal timing explain why.'
        :conclusion==='fraud'
          ?'The evidence does not support fraud. In fact, several independent pieces of information point to a legitimate annual renewal. The right move is to revise the initial conclusion when the evidence changes.'
          :'The AI did not fail. It correctly identified an unusual payment for review. The accountant’s job is to decide whether the unusual item is actually a problem.';
      return `<div class="teacher-case">
        <div class="teacher-case-head"><span class="teacher-step">Step 3</span><h3>Now explain the judgment.</h3></div>
        <div class="teacher-case-body">
          <div class="teacher-case-reveal"><h4>What the evidence supports</h4><p>${msg}</p></div>
          <div class="dialogue"><span class="speaker">Your manager</span><p>“The system flagged this. Based on the evidence you reviewed, what would you tell me about the payment?”</p></div>
          <div class="teacher-case-question">What is the strongest explanation?</div>
          ${teacherCaseButtons('teacher_ai',3,[{label:'“The contract, invoice, approvals, prior-year payment, and renewal date all support a legitimate annual payment.”',value:'evidence'},{label:'“The AI is probably wrong, so I would ignore it.”',value:'aiwrong'},{label:'“I cannot explain it, but the payment feels fine.”',value:'feeling'}])}
          <div class="reasoning-step"><h4>Defend the reasoning</h4><p>Why is an explanation tied to evidence stronger than simply agreeing or disagreeing with the technology?</p></div>
          ${teacherResetButton('teacher_ai')}
        </div></div>`;
    }

    const final=c.choices[2];
    const msg=final==='evidence'
      ?'Exactly. The accountant can explain the conclusion using evidence and remains responsible for that judgment.'
      :final==='aiwrong'
        ?'The conclusion should not be “AI was wrong.” The tool did something useful by surfacing an unusual item. The professional judgment comes from explaining what the evidence shows.'
        :'Professional judgment has to be explainable. A conclusion based on evidence is stronger than one based on a feeling.';
    return `<div class="teacher-case">
      <div class="teacher-case-head"><span class="kicker">Career reveal</span><h3>AI changed the workflow; it did not finish the judgment.</h3></div>
      <div class="teacher-case-body">
        <div class="teacher-case-reveal"><h4>Reasoning check</h4><p>${msg}</p></div>
        ${accountantDid('What did the accountant actually do?',['used AI to surface an unusual item','tested the flag against context and evidence','changed the conclusion when the evidence required it','explained the final judgment to a manager','remained responsible for the conclusion'],['blindly trusting the software','blindly rejecting the software','advanced coding'],['Technology literacy','Judgment','Communication','Accountability'])}
        ${teacherResetButton('teacher_ai')}
      </div></div>`;
  }

  const teacherSlides=[
    {label:'Accounting Career Lab',title:'Don’t just read about accounting. Try the work.',body:`<p class="present-quote">For the next 20–30 minutes, you are going to investigate, question, explain, and make judgment calls like accountants do.</p><div class="present-callout"><strong>Designed for any starting point.</strong> We will start with ordinary business situations and introduce accounting terms only after the ideas make sense.</div>`},
    {label:'Practice areas',title:'Accounting includes many different career paths.',body:`<div class="present-grid present-grid-3"><div class="present-tile"><span class="kicker">Record</span><h3>Corporate / Bookkeeping</h3><p>Track sales, spending, payroll, and inventory so a business knows what is happening.</p></div><div class="present-tile"><span class="kicker">Advise</span><h3>Tax / Advisory</h3><p>Compare choices like where to expand and explain the financial trade-offs behind a recommendation.</p></div><div class="present-tile"><span class="kicker">Verify</span><h3>Audit</h3><p>Test whether claims about cash, inventory, or other numbers can be supported by evidence.</p></div><div class="present-tile"><span class="kicker">Investigate</span><h3>Forensic Accounting</h3><p>Follow suspicious payments or missing money by analyzing records and talking to people.</p></div><div class="present-tile"><span class="kicker">Evaluate</span><h3>M&A / Transactions</h3><p>Study whether a company is a good deal, what it is worth, and what risks could change the price.</p></div><div class="present-tile"><span class="kicker">Adapt</span><h3>Technology & Analytics</h3><p>Use data, systems, and AI to spot unusual items and support decisions faster.</p></div></div>`},
    {label:'60-second baseline',title:'Yes, accounting starts with accurate records. But that is only the beginning.',body:()=>teacherBookkeepingCase()},
    {label:'Investigate',title:'Forensic accounting: follow the money—and talk to people.',body:()=>teacherForensicCase()},
    {label:'Verify',title:'Audit: challenge an explanation without jumping to a conclusion.',body:()=>teacherAuditCase()},
    {label:'Advise',title:'Tax & advisory: make a recommendation you can defend.',body:()=>teacherAdvisoryCase()},
    {label:'AI & Accounting',title:'AI can change the task without making the judgment for you.',body:`<div class="present-grid"><div class="present-tile"><span class="kicker">AI can help with</span><h3>Speed + scale</h3><ul><li>Scan large amounts of data</li><li>Flag unusual transactions</li><li>Summarize documents and guidance</li><li>Automate repetitive steps</li></ul></div><div class="present-tile"><span class="kicker">People add</span><h3>Context + judgment</h3><ul><li>Decide which flags actually matter</li><li>Understand the business situation</li><li>Question explanations and gather evidence</li><li>Explain and take responsibility for the conclusion</li></ul></div></div><div class="present-callout"><strong>Think of AI as part of the workflow.</strong> The next case shows why an unusual item can be useful for AI to flag while still requiring a person to decide what it means.</div>`},
    {label:'Adapt',title:'AI: use the technology, then explain the judgment.',body:()=>teacherAICase()},
    {label:'What changed?',title:'The work was not just numbers. It was people, evidence, and judgment.',body:`<div class="present-grid present-grid-3"><div class="present-tile"><h3>Argue</h3><p>Challenge an explanation respectfully when the evidence does not yet support it.</p></div><div class="present-tile"><h3>Explain</h3><p>Tell a manager, client, or teammate why your conclusion makes sense.</p></div><div class="present-tile"><h3>Judge</h3><p>Decide when you have enough information—and when you still need more.</p></div><div class="present-tile"><h3>Investigate</h3><p>Ask questions and connect information when something does not make sense.</p></div><div class="present-tile"><h3>Advise</h3><p>Compare options and help someone make a business decision.</p></div><div class="present-tile"><h3>Use technology</h3><p>Let tools surface information, then decide what that information actually means.</p></div></div>`},
    {label:'Career connection',title:'Those behaviors show up across the profession.',body:`<div class="present-grid present-grid-3"><div class="present-tile"><span class="kicker">Audit</span><h3>Evidence + communication</h3><p>Question, verify, explain.</p></div><div class="present-tile"><span class="kicker">Forensic</span><h3>Investigation + interviewing</h3><p>Follow clues and test theories.</p></div><div class="present-tile"><span class="kicker">Tax / Advisory</span><h3>Analysis + recommendation</h3><p>Evaluate alternatives and advise clients.</p></div><div class="present-tile"><span class="kicker">M&A / Transactions</span><h3>Business analysis + risk</h3><p>Understand companies and deals.</p></div><div class="present-tile"><span class="kicker">Corporate</span><h3>Information + decisions</h3><p>Build reliable information businesses use.</p></div><div class="present-tile"><span class="kicker">Technology</span><h3>Data + judgment</h3><p>Use systems and AI without outsourcing responsibility.</p></div></div>`},
    {label:'Debrief',title:'Does this look like the accounting you pictured at the beginning?',body:`<div class="present-grid"><div class="present-tile"><h3>Discuss</h3><ul><li>Which case felt least like your original picture of accounting?</li><li>Where did communication matter most?</li><li>Which judgment call was hardest?</li><li>Which practice area would you want to try in more depth?</li></ul></div><div class="present-tile"><h3>Remember</h3><ul><li>Bookkeeping is one part of the profession.</li><li>Different accounting careers use different skills.</li><li>Technology changes the work, but people still interpret and explain.</li><li>The goal is not to convince you to choose accounting—it is to help you make an informed decision.</li></ul></div></div>`},
    {label:'High-school research gap',title:'One last question: did this change what accounting looks like to you?',body:`<div class="research-gap"><h3>Why we are asking</h3><p>Accounting career research often studies students after they reach college. That misses people who may have ruled accounting out earlier. Experiences like this help us understand what happens before that drop-off.</p></div><div class="present-callout"><strong>Exit prompt:</strong> Name two types of accounting work you did not know about before today. Then decide: does accounting seem more, less, or equally worth exploring?</div>`}
  ];


  function educatorLearnView(){
    state.userType='educator';
    save();
    document.body.classList.remove('teacher-board-mode');
    state.teacherPresenting=false;
    render(`
      <div class="educator-primer-hero">
        <span class="eyebrow">Learn · For Educators</span>
        <h1 class="page-title">Accounting Profession 101</h1>
        <p class="lede">This guide is designed for educators from any background. It provides clear vocabulary, examples, and mental models for introducing accounting as a broad business profession.</p>
        <div class="notice"><strong>A helpful starting point:</strong> Accounting spans many job areas and industries. Accountants help organizations understand information, verify it, make decisions, investigate questions, evaluate transactions, and use technology responsibly.</div>
      </div>

      <div class="primer-nav">
        <a href="#edu-practice">Practice areas</a><a href="#edu-workplaces">Where accountants work</a><a href="#edu-matrix">Practice area vs. industry</a><a href="#edu-realwork">What the work looks like</a><a href="#edu-mobility">Career mobility</a><a href="#edu-myths">Misconceptions</a><a href="#edu-language">How to explain it</a><a href="#edu-industries">Conversation starters</a><a href="#edu-cheat">Teacher cheat sheet</a>
      </div>

      <section id="edu-practice" class="section">
        <span class="eyebrow">1 · The profession at a glance</span>
        <h2>Seven accounting areas to explore with students</h2>
        <p class="lede">Think about these as different ways accountants contribute to organizations.</p>
        <div class="primer-grid">
          <div class="primer-card"><span class="kicker">Corporate Accounting</span><h3>Understand and report what is happening inside a business.</h3><p>Corporate accountants work for one organization. They help track activity, prepare reliable financial information, understand performance, and support internal decisions.</p><div class="primer-simple"><strong>Student-friendly explanation:</strong> “They help a company understand what happened financially and what it means.”</div></div>
          <div class="primer-card"><span class="kicker">Audit & Assurance</span><h3>Check whether information can be trusted.</h3><p>Auditors gather evidence, ask questions, test information, and decide whether reported financial information is supported.</p><div class="primer-simple"><strong>Student-friendly explanation:</strong> “They do not just accept the number—they ask what evidence supports it.”</div></div>
          <div class="primer-card"><span class="kicker">Tax</span><h3>Understand how tax rules affect real decisions.</h3><p>Tax professionals may prepare filings, but many roles also involve research, planning, transactions, expansion decisions, compensation, and explaining complicated rules.</p><div class="primer-simple"><strong>Student-friendly explanation:</strong> “They help people and businesses understand the tax consequences of choices.”</div></div>
          <div class="primer-card"><span class="kicker">Advisory / Consulting</span><h3>Help organizations solve business, financial, or operational problems.</h3><p>Advisory work can involve finance transformation, risk, systems, strategy implementation, controls, data, or specialized business questions.</p><div class="primer-simple"><strong>Student-friendly explanation:</strong> “They use accounting and business knowledge to help solve a problem.”</div></div>
          <div class="primer-card"><span class="kicker">Forensic Accounting</span><h3>Investigate when something may have gone wrong.</h3><p>Forensic accountants follow financial evidence, analyze patterns, review documents, interview people, and help explain what happened in fraud investigations or disputes.</p><div class="primer-simple"><strong>Student-friendly explanation:</strong> “They follow the money and connect evidence when something does not make sense.”</div></div>
          <div class="primer-card"><span class="kicker">M&A / Transactions</span><h3>Evaluate companies and business deals.</h3><p>Transaction professionals help buyers and sellers understand earnings, value, risks, and issues that may affect the price or structure of a deal.</p><div class="primer-simple"><strong>Student-friendly explanation:</strong> “Before a company buys another company, someone has to understand what it is really buying.”</div></div>
          <div class="primer-card"><span class="kicker">Technology & Analytics</span><h3>Use data, systems, automation, and AI to improve financial work.</h3><p>Technology-enabled accountants may analyze large datasets, improve business systems, automate processes, investigate exceptions, or help teams use AI responsibly.</p><div class="primer-simple"><strong>Student-friendly explanation:</strong> “Technology can surface information faster; accountants still have to determine what it means.”</div></div>
        </div>
      </section>

      <section id="edu-workplaces" class="section">
        <span class="eyebrow">2 · Where accountants work</span>
        <h2>Accounting is a profession that travels across organizations and industries.</h2>
        <div class="workplace-grid">
          <div class="workplace-card"><span class="kicker">Public accounting / professional services</span><h3>Serve many different clients.</h3><p>Professionals may work in audit, tax, transactions, forensic work, technology, consulting, or other advisory services. They learn about multiple organizations rather than working for only one.</p><p><strong>The Big Four:</strong> the largest global professional-services networks commonly associated with accounting.</p><div class="big4-strip"><div class="big4-chip">Deloitte</div><div class="big4-chip">PwC</div><div class="big4-chip">EY</div><div class="big4-chip">KPMG</div></div><p class="muted">They are important employers, but they are not the entire profession. National, regional, local, and specialized firms also employ accountants.</p></div>
          <div class="workplace-card"><span class="kicker">Corporate / industry</span><h3>Work inside one organization.</h3><p>An accountant can work directly for a technology company, sports team, retailer, hospital, entertainment company, startup, manufacturer, or almost any other organization.</p><p><strong>Possible work:</strong> corporate accounting, financial reporting, internal audit, planning, accounting systems, controls, revenue, cost analysis, or finance transformation.</p></div>
          <div class="workplace-card"><span class="kicker">Government & public service</span><h3>Protect public resources and support public decisions.</h3><p>Government accounting careers can involve budgeting, auditing, financial reporting, regulation, investigations, and financial analysis at the federal, state, or local level.</p></div>
          <div class="workplace-card"><span class="kicker">Nonprofits & mission-driven organizations</span><h3>Use accounting in organizations with goals beyond profit.</h3><p>Universities, charities, museums, foundations, hospitals, and other nonprofits still need reliable reporting, budgeting, internal controls, grant accounting, and financial decision support.</p></div>
        </div>
        <div class="accent-box section"><strong>Useful message for students:</strong> If a student already loves sports, music, gaming, fashion, healthcare, or technology, accounting does not have to compete with that interest. Accounting can be the way they work <em>inside</em> that industry.</div>
      </section>

      <section id="edu-matrix" class="section">
        <span class="eyebrow">3 · A helpful distinction</span>
        <h2>Practice area = what you do. Industry = where you apply it.</h2>
        <table class="matrix-table">
          <tr><th>Practice area</th><th>Industry</th><th>What that combination could look like</th></tr>
          <tr><td>Audit</td><td>Media & Entertainment</td><td>An audit team tests financial information for a streaming or entertainment company.</td></tr>
          <tr><td>Tax</td><td>Technology</td><td>A tax professional helps a software company understand the consequences of expansion or transactions.</td></tr>
          <tr><td>Forensic</td><td>Government</td><td>A forensic accountant analyzes records and financial relationships during an investigation.</td></tr>
          <tr><td>Corporate Accounting</td><td>Sports</td><td>An accountant works directly for a team or league and helps it understand revenue, payroll, sponsorships, and costs.</td></tr>
          <tr><td>Transactions</td><td>Healthcare</td><td>A deal team evaluates financial information when one healthcare organization considers acquiring another.</td></tr>
        </table>
      </section>

      <section id="edu-realwork" class="section">
        <span class="eyebrow">4 · How the work comes to life</span>
        <h2>Bring the profession to life through business situations.</h2>
        <div class="primer-grid">
          <div class="primer-card"><h3>Audit</h3><p>“A company says it owns $10 million of inventory. What evidence would convince you that the inventory really exists?”</p></div>
          <div class="primer-card"><h3>Tax / Advisory</h3><p>“A company wants to open a new location. What financial and tax trade-offs should it compare before deciding?”</p></div>
          <div class="primer-card"><h3>Forensic</h3><p>“Money is missing. Which payments, documents, emails, and people would you examine to understand what happened?”</p></div>
          <div class="primer-card"><h3>M&A / Transactions</h3><p>“A company wants to buy another business. Are the earnings sustainable, and what risks could change the price?”</p></div>
          <div class="primer-card"><h3>Corporate Accounting</h3><p>“Leaders want to know whether a product is making money and why results changed. What information do they need?”</p></div>
          <div class="primer-card"><h3>Technology & Analytics</h3><p>“A system flags 500 unusual transactions. Which ones actually matter, and how would you explain your conclusion?”</p></div>
        </div>
      </section>

      <section id="edu-mobility" class="section">
        <span class="eyebrow">5 · Career mobility</span>
        <h2>Accounting can open several different career directions over time.</h2>
        <div class="ai-flow">
          <div><strong>Audit</strong>Audit Associate → Senior / Manager → Internal Audit, Financial Reporting, Controller, Transactions, Finance or leadership roles</div>
          <div><strong>Tax</strong>Tax Associate → Specialty / Consulting → Corporate Tax, Tax Technology, Planning or leadership roles</div>
          <div><strong>Accounting + Data</strong>Accounting / Analytics → Systems, Automation, Finance Transformation, Technology-enabled assurance or consulting</div>
        </div>
        <p class="muted section">These are examples, not fixed ladders. Career movement depends on experience, credentials, employer, interests, and opportunities.</p>
      </section>

      <section id="edu-myths" class="section">
        <span class="eyebrow">6 · Common questions and perceptions students may bring</span>
        <h2>Add helpful context while keeping the profession grounded and realistic.</h2>
        <div class="misconception-list">
          <div class="misconception"><h3>“Accounting is mostly math.”</h3><p><strong>Helpful context:</strong> Accountants use numbers, but the work also relies heavily on logic, business understanding, evidence, research, communication, and judgment.</p></div>
          <div class="misconception"><h3>“Accounting means doing taxes.”</h3><p><strong>Helpful context:</strong> Tax is one major area. Other paths include audit, corporate accounting, forensics, transactions, advisory, analytics, systems, and more.</p></div>
          <div class="misconception"><h3>“Accountants sit alone at a desk.”</h3><p><strong>Helpful context:</strong> Many roles involve clients, managers, interviews, meetings, presentations, teamwork, investigation, and explaining decisions.</p></div>
          <div class="misconception"><h3>“I have to work at an accounting firm.”</h3><p><strong>Helpful context:</strong> Accounting firms are one pathway. Accountants also work directly inside companies, government, nonprofits, startups, universities, healthcare systems, sports organizations, and more.</p></div>
          <div class="misconception"><h3>“AI means there will be no need for accountants.”</h3><p><strong>Helpful context:</strong> AI is automating and changing tasks. The profession is increasingly emphasizing the ability to use technology while applying context, judgment, skepticism, communication, and accountability.</p></div>
        </div>
      </section>

      <section id="edu-language" class="section">
        <span class="eyebrow">7 · How to talk about accounting with students</span>
        <h2>Start with the problem. Name the technical term later.</h2>
        <div class="teacher-say"><div class="instead"><strong>Technical phrasing:</strong><br>“Accounting is about preparing financial statements.”</div><div class="say"><strong>Student-friendly phrasing:</strong><br>“Accounting helps people understand what is happening inside a business and communicate that information clearly.”</div></div>
        <div class="teacher-say"><div class="instead"><strong>Technical phrasing:</strong><br>“Auditors test financial statement assertions.”</div><div class="say"><strong>Student-friendly phrasing:</strong><br>“Auditors ask whether the evidence supports what a company is reporting.”</div></div>
        <div class="teacher-say"><div class="instead"><strong>Technical phrasing:</strong><br>“Tax accountants prepare returns.”</div><div class="say"><strong>Student-friendly phrasing:</strong><br>“Tax professionals help people and businesses understand how tax rules affect decisions.”</div></div>
        <div class="teacher-say"><div class="instead"><strong>Technical phrasing:</strong><br>“Forensic accountants investigate fraud.”</div><div class="say"><strong>Student-friendly phrasing:</strong><br>“Forensic accountants follow financial evidence when something does not make sense.”</div></div>
        <div class="notice"><strong>Teaching tip:</strong> Start with the situation in plain English, then connect it to the accounting term once the idea is clear.</div>
      </section>

      <section id="edu-industries" class="section">
        <span class="eyebrow">8 · Industry conversation starters</span>
        <h2>Connect accounting to interests students already have.</h2>
        <div class="conversation-grid">
          <div class="conversation-card"><span class="kicker">Entertainment</span><h3>Ask:</h3><p>Who tracks production costs, streaming revenue, royalties, budgets, and whether a project stayed financially on track?</p></div>
          <div class="conversation-card"><span class="kicker">Sports</span><h3>Ask:</h3><p>Who helps a team understand ticket revenue, payroll, sponsorship agreements, merchandise, and operating costs?</p></div>
          <div class="conversation-card"><span class="kicker">Technology</span><h3>Ask:</h3><p>Who helps a software company understand subscriptions, growth, costs, transactions, and the financial impact of major decisions?</p></div>
          <div class="conversation-card"><span class="kicker">Fashion / Retail</span><h3>Ask:</h3><p>Who tracks inventory, product margins, store performance, online sales, returns, and whether a product line is profitable?</p></div>
          <div class="conversation-card"><span class="kicker">Healthcare</span><h3>Ask:</h3><p>Who helps hospitals and healthcare organizations understand budgets, costs, reimbursements, controls, and reporting?</p></div>
          <div class="conversation-card"><span class="kicker">Gaming / Media</span><h3>Ask:</h3><p>Who helps leaders understand development costs, digital revenue, licensing, acquisitions, and the economics of a new release?</p></div>
        </div>
      </section>

      <section id="edu-cheat" class="section cheat-sheet">
        <span class="eyebrow">9 · Teacher cheat sheet</span>
        <h2>Accounting in 60 seconds</h2>
        <div class="cheat-sheet-grid">
          <div><h3>Accounting helps organizations:</h3><ul><li>Record what happened</li><li>Understand performance</li><li>Verify information</li><li>Make decisions</li><li>Investigate problems</li><li>Evaluate transactions</li><li>Use technology and data</li></ul></div>
          <div><h3>Major career areas:</h3><p>Corporate · Audit · Tax · Advisory · Forensic · Transactions · Technology</p><h3>Where accountants work:</h3><p>Accounting firms · Corporations · Government · Nonprofits · Nearly every industry</p><h3>Big Four:</h3><p>Deloitte · PwC · EY · KPMG</p></div>
        </div>
        <div class="accent-box section"><strong>Most important message for students:</strong> Accounting is a way of understanding and solving business problems—not just a class about debits and credits.</div>
        <div class="cta-row"><button class="btn btn-primary" onclick="app.go('teachers')">Launch the Guided Classroom Experience</button><button class="btn btn-secondary" onclick="app.go('careers')">View Student Career Explorer</button></div>
      </section>
    `);
  }

  function teachersView(){
    state.userType='educator';
    save();
    if(!state.teacherPresenting){
      document.body.classList.remove('teacher-board-mode');
      render(`<div class="teacher-prep">
        <div class="teacher-prep-hero">
          <span class="eyebrow">Teacher / Advisor Mode</span>
          <span class="lab-badge">Accounting Career Lab · 20–30 minutes · No prep required</span>
          <h1>Walk the class through what accounting work actually feels like.</h1>
          <p class="lede">This is designed for a high-school business teacher with one class period and students who may know almost nothing about accounting. Project it on the board, let students make decisions together, ask them to defend their reasoning, and reveal what happens next.</p>
          <div class="research-gap"><h3>Why use this in high school?</h3><p>Most accounting-specific career evidence is gathered after students reach college. This experience intentionally targets the earlier point—before students may already have ruled accounting out.</p></div>
        </div>
        <div class="teacher-prep-grid">
          <div class="teacher-prep-card"><h3>Earlier</h3><p>Designed for the high-school decision window, before technical coursework becomes the main picture students have of accounting.</p></div>
          <div class="teacher-prep-card"><h3>Experiential</h3><p>Students do simplified versions of the work: investigate, verify, advise, and evaluate technology output.</p></div>
          <div class="teacher-prep-card"><h3>Human</h3><p>Every major case includes a person to question, explain to, challenge, or advise—showing the communication and judgment that career materials can miss.</p></div>
        </div>
        <section class="section card">
          <h2>Suggested flow</h2>
          <p><strong>Practice Areas → 60-second Recordkeeping Baseline → Forensic → Audit → Tax/Advisory → AI & Accounting → AI Case → Human Skills → Career Connection → Debrief</strong></p>
          <p class="muted">Approximate presentation time: 20–30 minutes depending on discussion. The experience is designed for any starting point.</p>
        </section>
        <section class="section card">
          <h2>Facilitation cues</h2>
          <div class="grid grid-2">
            <div><strong>Before clicking</strong><p>Ask students to explain why they chose an option.</p></div>
            <div><strong>After a reveal</strong><p>Ask what the new information changes.</p></div>
            <div><strong>When a technical term appears</strong><p>Explain the plain-English idea first, then name the accounting term.</p></div>
            <div><strong>When there is uncertainty</strong><p>Emphasize that accountants often need more evidence before reaching a conclusion.</p></div>
          </div>
        </section>
        <div class="teacher-prep-actions">
          <button class="btn btn-primary" onclick="app.startTeacherPresentation()">Present to Class</button>
          <button class="btn btn-secondary" onclick="app.startStudentExperience()">Open Individual Student Experience</button>
        </div>
      </div>`);
      return;
    }
    document.body.classList.add('teacher-board-mode');
    const i=Math.max(0,Math.min(state.teacherSlide||0,teacherSlides.length-1));
    const slide=teacherSlides[i];
    const body=typeof slide.body==='function'?slide.body():slide.body;
    render(`<div class="board-shell">
      <div class="board-top">
        <div class="board-brand">Making It Make Cents</div>
        <div class="board-meta"><span>${slide.label}</span><span>${i+1} / ${teacherSlides.length}</span><button id="fullscreenBtn" class="board-fullscreen" onclick="app.toggleFullscreen()">Fullscreen</button><button class="board-exit" onclick="app.exitTeacherPresentation()">Exit presentation</button></div>
      </div>
      <main class="board-stage">
        <div class="present-label">${slide.label}</div>
        <h1>${slide.title}</h1>
        ${body}
      </main>
      <div class="board-controls">
        <div class="board-nav-group">
          <button class="btn btn-secondary" ${i===0?'disabled':''} onclick="app.teacherPrev()">← Back</button>
          <button class="btn btn-primary" ${i===teacherSlides.length-1?'disabled':''} onclick="app.teacherNext()">Next →</button>
        </div>
        <div class="board-progress">${teacherSlides.map((_,n)=>`<span class="${n===i?'active':''}"></span>`).join('')}</div>
        <div class="board-teacher-hint">Teacher controls the screen. Let students discuss before selecting the class answer.</div>
      </div>
    </div>`);
  }
  function startTeacherPresentation(){
    state.teacherPresenting=true;
    state.teacherSlide=0;
    state.teacherCases={};
    save();
    teachersView();
  }
  function exitTeacherPresentation(){
    state.teacherPresenting=false;
    document.body.classList.remove('teacher-board-mode');
    save();
    teachersView();
  }

  function toggleFullscreen(){
    const el=document.documentElement;
    if(!document.fullscreenElement){
      if(el.requestFullscreen){
        el.requestFullscreen().catch(()=>{});
      }
    }else if(document.exitFullscreen){
      document.exitFullscreen().catch(()=>{});
    }
  }

  function teacherNext(){state.teacherSlide=Math.min((state.teacherSlide||0)+1,teacherSlides.length-1);save();teachersView()}
  function teacherPrev(){state.teacherSlide=Math.max((state.teacherSlide||0)-1,0);save();teachersView()}
  function startStudentExperience(){state.teacherPresenting=false;document.body.classList.remove('teacher-board-mode');state.userType='student';save();studentPracticeAreasView()}

  return {go,reset,setUserType,setSimStep,answerStudentSim,completeSim,selectCareer,selectMyth,setAIStep,startAI,startAICases,aiView,aiAnswer,completeAI,selectIndustry,teacherNext,teacherPrev,startTeacherPresentation,exitTeacherPresentation,toggleFullscreen,startStudentExperience,studentPracticeAreasView,teacherCaseChoose,teacherCaseReset};
})();
document.addEventListener('DOMContentLoaded',()=>app.go('home'));
</script>
